<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>حرب الجزر 3D — الخرائط V0.2</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071a2a;color:#fff;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}#view{position:absolute;inset:0;touch-action:none}#ui{position:absolute;top:12px;right:12px;left:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:none}#ui>*{pointer-events:auto}button,select{background:#143a53;color:white;border:1px solid #477c9a;border-radius:10px;padding:10px 13px;font-size:15px}button:active{background:#276184}#info{background:#071a2acb;padding:10px 14px;border-radius:10px;font-size:13px}#hint{position:absolute;bottom:12px;right:12px;left:12px;text-align:center;font-size:12px;background:#071a2ab8;padding:8px;border-radius:10px}#error{position:absolute;top:45%;width:100%;text-align:center;color:#ffdbb0;display:none}.tag{font-weight:700}</style></head><body><div id="view"></div><div id="ui"><select id="size"><option value="small">صغيرة (15–25 مدينة)</option><option value="medium" selected>متوسطة (30–45 مدينة)</option><option value="large">كبيرة (50–80 مدينة)</option></select><button id="generate">خريطة جديدة</button><button id="reset">إعادة الكاميرا</button><button id="export">تصدير بيانات الخريطة</button><div id="info">جارٍ التحميل...</div></div><div id="hint">اسحب بإصبع لتدوير الخريطة • إصبعان للتحريك والتقريب • اضغط مدينة لمعرفة تفاصيلها</div><div id="error">تعذر تحميل محرك 3D. افتح الملف مع اتصال بالإنترنت في Safari.</div><script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script><script>
(()=>{'use strict';if(!window.THREE){document.getElementById('error').style.display='block';return;}const T=THREE,view=document.getElementById('view'),info=document.getElementById('info');const scene=new T.Scene();scene.background=new T.Color(0x91d9ed);scene.fog=new T.FogExp2(0x91d9ed,.0008);const camera=new T.PerspectiveCamera(48,innerWidth/innerHeight,.1,1000),renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=T.SRGBColorSpace;view.appendChild(renderer.domElement);scene.add(new T.HemisphereLight(0xe7faff,0x4d6751,2.3));const sun=new T.DirectionalLight(0xffedc0,2.4);sun.position.set(-60,90,30);scene.add(sun);const ocean=new T.Mesh(new T.PlaneGeometry(1200,1200),new T.MeshStandardMaterial({color:0x177eaa,roughness:.38,metalness:.12}));ocean.rotation.x=-Math.PI/2;ocean.position.y=-1.2;scene.add(ocean);let group=new T.Group();scene.add(group);let mapData=null,labels=[],pickable=[];const COLORS=[0x287bff,0xe64b4b,0x8f5ae6,0x36b76b,0xe6ac37,0xd4dce5];let seed=1;function rand(){seed=(Math.imul(1664525,seed)+1013904223)>>>0;return seed/4294967296}function between(a,b){return a+(b-a)*rand()}function mat(c){return new T.MeshStandardMaterial({color:c,roughness:.86,flatShading:true})}const wallMat=mat(0xece2cb),roofMat=mat(0x7a5651),neutralMat=mat(0x8995a1);function mesh(geo,material,x,y,z,parent=group){let m=new T.Mesh(geo,material);m.position.set(x,y,z);parent.add(m);return m}function box(w,h,d,material,x,y,z,parent){return mesh(new T.BoxGeometry(w,h,d),material,x,y,z,parent)}function island(cx,cz,rx,rz,biome){const palette=biome==='desert'?[0xc5a56e,0xe6ca8c]:biome==='snow'?[0xa9b9ba,0xeaf4f7]:[0x537c50,0x82b56b];const sides=16,vertices=[],indices=[];for(let layer=0;layer<3;layer++){const scale=[1.1,.92,.68][layer],y=[-.8,.45,1.6][layer];for(let j=0;j<sides;j++){let a=j/sides*Math.PI*2,noise=1+Math.sin(j*3.2+cx)*.09;vertices.push(Math.cos(a)*rx*scale*noise,y,Math.sin(a)*rz*scale*noise)}}for(let layer=0;layer<2;layer++)for(let j=0;j<sides;j++){let a=layer*sides+j,b=layer*sides+(j+1)%sides,c=(layer+1)*sides+j,d=(layer+1)*sides+(j+1)%sides;indices.push(a,b,c,b,d,c)}const geo=new T.BufferGeometry();geo.setAttribute('position',new T.Float32BufferAttribute(vertices,3));geo.setIndex(indices);geo.computeVertexNormals();let islandMesh=mesh(geo,mat(palette[0]),cx,0,cz);mesh(new T.CylinderGeometry(Math.min(rx,rz)*.85,Math.min(rx,rz)*.9,.35,12),mat(palette[1]),cx,1.4,cz);if(biome==='tropical'){for(let k=0;k<4;k++){let x=cx+between(-rx*.5,rx*.5),z=cz+between(-rz*.5,rz*.5);mesh(new T.CylinderGeometry(.15,.22,1.5,5),mat(0x765338),x,2.25,z);mesh(new T.ConeGeometry(.85,2.2,6),mat(0x247348),x,3.7,z)}}else if(biome==='snow'){for(let k=0;k<3;k++){let x=cx+between(-rx*.5,rx*.5),z=cz+between(-rz*.5,rz*.5);mesh(new T.ConeGeometry(1.1,2.4,5),mat(0x4c7976),x,2.7,z);mesh(new T.ConeGeometry(.65,1,5),mat(0xffffff),x,3.75,z)}}else{for(let k=0;k<3;k++){let x=cx+between(-rx*.5,rx*.5),z=cz+between(-rz*.5,rz*.5);mesh(new T.CylinderGeometry(.12,.17,1.4,5),mat(0x45865a),x,2.25,z)}}}
function city(c){const color=c.owner===null?0x9ca3a8:COLORS[c.owner];const base=mesh(new T.CylinderGeometry(1.6,1.9,.65,8),mat(color),c.x,2,c.z);base.userData.city=c;pickable.push(base);let tower=mesh(new T.CylinderGeometry(.85,1.05,2,6),wallMat,c.x,3.25,c.z);tower.userData.city=c;pickable.push(tower);mesh(new T.ConeGeometry(1.25,1.1,6),mat(c.owner===null?0x707d85:color),c.x,4.8,c.z);for(let k=0;k<3;k++){let a=k*Math.PI*2/3;box(.75,1.1,.75,wallMat,c.x+Math.cos(a)*1.9,2.45,c.z+Math.sin(a)*1.9);mesh(new T.ConeGeometry(.62,.65,4),roofMat,c.x+Math.cos(a)*1.9,3.3,c.z+Math.sin(a)*1.9)}const canvas=document.createElement('canvas');canvas.width=256;canvas.height=128;const ctx=canvas.getContext('2d');ctx.fillStyle='#092b3fe6';ctx.fillRect(12,10,232,108);ctx.fillStyle='#fff';ctx.font='bold 29px system-ui';ctx.textAlign='center';ctx.fillText(c.owner===null?'محايدة':c.owner===0?'أنت':'كمبيوتر '+c.owner,128,53);ctx.font='25px system-ui';ctx.fillText('مدينة '+c.id,128,91);const texture=new T.CanvasTexture(canvas);const sprite=new T.Sprite(new T.SpriteMaterial({map:texture,depthTest:false}));sprite.position.set(c.x,7.7,c.z);sprite.scale.set(5.1,2.55,1);group.add(sprite);labels.push(sprite)}
function generate(){
seed=(Date.now()>>>0)||1234;
const size=document.getElementById('size').value;
const limits={small:[15,25,6,38],medium:[30,45,9,55],large:[50,80,13,75]};
const cfg=limits[size],count=Math.floor(between(cfg[0],cfg[1]+1));
scene.remove(group);group=new T.Group();scene.add(group);pickable=[];labels=[];
// Connected irregular land masses, with six or more guaranteed city-bearing regions.
const islands=[];
const n=cfg[2],radius=cfg[3];
for(let i=0;i<n;i++){
 const angle=2*Math.PI*i/n+between(-.13,.13),ring=radius*(i%3===0?.60:.80);
 const x=Math.cos(angle)*ring+between(-3,3),z=Math.sin(angle)*ring*.72+between(-3,3);
 const rx=between(13,19),rz=between(12,18);
 islands.push({x,z,rx,rz,biome:['tropical','desert','snow'][Math.floor(rand()*3)]});
}
// Additional interlocking islands create a contiguous, archipelago-like map.
const terrain=[];
for(let i=0;i<islands.length;i++){
 const base=islands[i];terrain.push(base);
 const satelliteCount=i%2===0?2:1;
 for(let j=0;j<satelliteCount;j++){
  const a=between(0,Math.PI*2),d=between(10,16);
  terrain.push({x:base.x+Math.cos(a)*d,z:base.z+Math.sin(a)*d,rx:between(9,14),rz:between(9,13),biome:base.biome});
 }
}
terrain.forEach(i=>island(i.x,i.z,i.rx,i.rz,i.biome));
const cities=[];
// Spatially separated city positions, with minimum gap for legible buildings.
const quota=Array(n).fill(Math.floor(count/n));for(let i=0;i<count%n;i++)quota[i]++;
for(let i=0;i<n;i++){
 const is=islands[i],q=quota[i],cols=Math.ceil(Math.sqrt(q)),rows=Math.ceil(q/cols);
 for(let j=0;j<q;j++){
  const col=j%cols,row=Math.floor(j/cols);
  const x=is.x+(col-(cols-1)/2)*8.2+between(-.7,.7);
  const z=is.z+(row-(rows-1)/2)*8.2+between(-.7,.7);
  cities.push({id:cities.length+1,x:+x.toFixed(2),z:+z.toFixed(2),island:i,owner:null,level:1,strength:['weak','medium','strong'][Math.floor(rand()*3)]});
 }
}
// Choose one start per separate region first, maximizing mutual distance.
const chosen=[],usedRegions=new Set();
while(chosen.length<6){let best=-1,score=-Infinity;
 for(let i=0;i<cities.length;i++){
  if(usedRegions.has(cities[i].island))continue;
  const distance=chosen.length?Math.min(...chosen.map(j=>Math.hypot(cities[i].x-cities[j].x,cities[i].z-cities[j].z))):Math.hypot(cities[i].x,cities[i].z);
  if(distance>score){score=distance;best=i}
 }
 if(best<0)break;chosen.push(best);usedRegions.add(cities[best].island);
}
chosen.forEach((i,player)=>{cities[i].owner=player;cities[i].strength='starting'});
cities.forEach(city);
mapData={format:'harb-aljuzur-map-v2',seed,size,cityCount:cities.length,islands:terrain,cities,playerCount:6,startingCityIds:chosen.map(i=>cities[i].id),rules:{neutralProduction:false,neutralStrengths:['weak','medium','strong'],startingCitiesPerPlayer:1}};
info.textContent=`${cities.length} مدينة • ${terrain.length} قطعة أرض • 6 مواقع بداية`;
resetCamera();
}
let target=new T.Vector3(),yaw=.65,pitch=.95,dist=175;function resetCamera(){yaw=.65;pitch=.95;dist=document.getElementById('size').value==='large'?150:document.getElementById('size').value==='small'?87:115;target.set(0,0,0);updateCamera()}function updateCamera(){pitch=Math.max(.2,Math.min(1.48,pitch));dist=Math.max(20,Math.min(280,dist));camera.position.set(target.x+dist*Math.sin(pitch)*Math.cos(yaw),target.y+dist*Math.cos(pitch),target.z+dist*Math.sin(pitch)*Math.sin(yaw));camera.lookAt(target)}const pointers=new Map();let lastPinch=0,lastMid=null,moved=false;renderer.domElement.addEventListener('pointerdown',e=>{renderer.domElement.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false});renderer.domElement.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const old=pointers.get(e.pointerId);let dx=e.clientX-old.x,dy=e.clientY-old.y;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(Math.abs(dx)+Math.abs(dy)>2)moved=true;if(pointers.size===1){yaw-=dx*.007;pitch-=dy*.006}else if(pointers.size===2){let ps=[...pointers.values()],d=Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y),mid={x:(ps[0].x+ps[1].x)/2,y:(ps[0].y+ps[1].y)/2};if(lastPinch)dist*=lastPinch/d;if(lastMid){let right=new T.Vector3().setFromMatrixColumn(camera.matrix,0);let forward=new T.Vector3();camera.getWorldDirection(forward);forward.y=0;forward.normalize();target.addScaledVector(right,-(mid.x-lastMid.x)*dist/750);target.addScaledVector(forward,(mid.y-lastMid.y)*dist/750)}lastPinch=d;lastMid=mid}updateCamera()});renderer.domElement.addEventListener('pointerup',e=>{if(!moved&&pointers.size===1){let p=new T.Vector2(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1),ray=new T.Raycaster();ray.setFromCamera(p,camera);let hit=ray.intersectObjects(pickable)[0];if(hit){let c=hit.object.userData.city;info.textContent=`مدينة ${c.id} • ${c.owner===null?'محايدة / '+({weak:'ضعيفة',medium:'متوسطة',strong:'قوية'}[c.strength]):c.owner===0?'مدينتك':'كمبيوتر '+c.owner} • المستوى ${c.level}`}}pointers.delete(e.pointerId);lastPinch=0;lastMid=null});renderer.domElement.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);lastPinch=0;lastMid=null});renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();dist*=Math.exp(e.deltaY*.001);updateCamera()},{passive:false});document.getElementById('generate').onclick=generate;document.getElementById('size').onchange=generate;document.getElementById('reset').onclick=resetCamera;document.getElementById('export').onclick=()=>{if(!mapData)return;let blob=new Blob([JSON.stringify(mapData,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='harb-aljuzur-'+mapData.size+'-'+mapData.seed+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});generate();(function animate(){requestAnimationFrame(animate);renderer.render(scene,camera)})()})();
</script></body></html>
