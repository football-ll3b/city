</style></head><body><canvas id="game"></canvas><div id="hud"><span class="pill" id="stats"></span><span class="pill" id="wave"></span><button id="startWave">▶ ابدأ الموجة</button><button id="pause">⏸ إيقاف</button><button id="menuBtn">☰ القائمة</button></div><div id="panel"></div><div id="bottom"></div><div id="toast"></div><div id="overlay"><div id="modal"></div></div><div id="rotate">📱 لف الجهاز للوضع الأفقي للعب دفاع القلعة 🏰</div><script>
'use strict';
const $=s=>document.querySelector(s),cv=$('#game'),ctx=cv.getContext('2d'),hud=$('#hud'),bottom=$('#bottom'),panel=$('#panel'),overlay=$('#overlay'),modal=$('#modal');
const TYPES=[{id:'arrow',name:'سهام',cost:65,range:118,damage:13,rate:.65,color:'#e7c67d',unlock:1},{id:'cannon',name:'مدفع',cost:110,range:105,damage:37,rate:1.75,color:'#5c6475',unlock:2},{id:'ice',name:'جليد',cost:100,range:108,damage:7,rate:.9,color:'#70d6ff',unlock:4},{id:'fire',name:'نار',cost:135,range:100,damage:12,rate:.48,color:'#ff8946',unlock:7},{id:'electric',name:'كهرباء',cost:160,range:122,damage:24,rate:1.2,color:'#d7aaff',unlock:11},{id:'sniper',name:'قناص',cost:185,range:210,damage:92,rate:2.4,color:'#b3e6a5',unlock:15}];
const WORLDS=[
 {name:'أكاديمية العناصر',icon:'🔥',ground:'#8bc775',path:'#d8c39b',accent:'#ff9d46',units:['كايرو','بركان','سيلفا','شعلة','فولكان','عين الصقر'],enemies:['شرارة فاسدة','عداء الرماد','حارس الصخور','خفاش اللهب','شبح الدخان','سيد الحمم']},
 {name:'وادي العواصف',icon:'⚡',ground:'#82b26f',path:'#cbb58d',accent:'#f5da65',units:['رايكن','رعد','نسيم','إعصار','شرارة','صاعق'],enemies:['جندي الرياح','وميض','درع الرعد','طائر العاصفة','ظل الغيم','ملك العواصف']},
 {name:'جزر الأعماق',icon:'🌊',ground:'#77b9a4',path:'#d9c49b',accent:'#58cfe6',units:['مارينا','مرجان','نوفا','موج','تيار','لؤلؤ'],enemies:['مخلوق المد','قرش خاطف','سلحفاة حديدية','سمكة مجنحة','شبح البحر','وحش الأعماق']},
 {name:'حصون الظلال',icon:'🌑',ground:'#8b9e79',path:'#b6ad95',accent:'#a58cf0',units:['زيروكس','أونيكس','قمر','ستار','ظل','طيف'],enemies:['جندي الظل','طيف سريع','حارس الظلام','غراب الليل','متسلل','سلطان الظلال']},
 {name:'حدائق البلور',icon:'❄️',ground:'#8aab84',path:'#c3a995',accent:'#a0eaff',units:['آيسرا','كريستا','ندى','فجر','زمرد','ثلج'],enemies:['شظية حية','جليد سريع','حارس البلور','فراشة جليدية','شبح ثلجي','ملكة الصقيع']},
 {name:'ممالك السحر',icon:'✨',ground:'#78aa82',path:'#b5ac98',accent:'#d6a1ff',units:['إيلورا','أركان','لونا','فيرا','أثير','سيرين'],enemies:['تعويذة هاربة','روح سريعة','غول مدرع','روح طائرة','ساحر خفي','سيد الطلاسم']},
 {name:'عرش النجوم',icon:'☄️',ground:'#b2b07e',path:'#cbb58c',accent:'#f6c36c',units:['أستريون','نيزك','سولار','أوربت','شهاب','كوزمو'],enemies:['مقاتل فضائي','مذنب خاطف','حارس نيزكي','كائن مجنح','شبح المجرة','إمبراطور النجوم']}
];
const worldFor=level=>WORLDS[Math.min(6,Math.max(0,Math.floor((level-1)/5)))];
const MAX_LEVEL=35;
const WAVES_PER_LEVEL=10;
const ENEMIES={normal:{hp:52,speed:39,armor:0,reward:9,color:'#d44c4c',damage:5},fast:{hp:36,speed:68,armor:0,reward:11,color:'#f3a93c',damage:4},armored:{hp:135,speed:25,armor:.38,reward:18,color:'#858a98',damage:10},flying:{hp:78,speed:53,armor:0,reward:15,color:'#c68be3',damage:7},hidden:{hp:62,speed:57,armor:0,reward:16,color:'#68c7a1',damage:6},boss:{hp:730,speed:19,armor:.23,reward:140,color:'#9d3a5b',damage:25}};
const STORE='castle_defense_ar_v1';let save;try{save=JSON.parse(localStorage.getItem(STORE))||{unlocked:1,stars:{},upgrades:{hp:0,gold:0,damage:0},endless:false}}catch(e){save={unlocked:1,stars:{},upgrades:{hp:0,gold:0,damage:0},endless:false}};save.upgrades||={hp:0,gold:0,damage:0};save.stars||={};
function persist(){try{localStorage.setItem(STORE,JSON.stringify(save))}catch(e){}}
let fxSoundLast=0;let game=null,scene='menu',last=0,scale=1,offX=0,offY=0,cam={x:0,y:0,z:1},drag=null,buildType='arrow',selected=null,power=null,audio=null,soundOn=true,toastTimer=0;
const W=1000,H=650;let paths=[];const rnd=(seed)=>{let t=seed+0x6D2B79F5;return()=>{t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}};
function makePaths(level){let r=rnd(level*981+22),n=level<=5?1:level<=12?2:3,res=[];for(let j=0;j<n;j++){let y0=n===1?280:(j+.5)*H/n,points=[{x:-30,y:y0}];for(let k=1;k<=5;k++){let x=80+k*140,y=y0+Math.sin((k+j*1.3)*1.65+level)*65+(r()-.5)*75;y=Math.max(75,Math.min(H-75,y));points.push({x,y})}points.push({x:945,y:325});res.push(points)}return res}
function segments(p){let a=[],sum=0;for(let i=1;i<p.length;i++){let len=Math.hypot(p[i].x-p[i-1].x,p[i].y-p[i-1].y);a.push({a:p[i-1],b:p[i],from:sum,len});sum+=len}return{parts:a,total:sum}}
function atPath(path,d){let seg=path.parts.find(s=>d<=s.from+s.len)||path.parts.at(-1),t=Math.max(0,Math.min(1,(d-seg.from)/seg.len));return{x:seg.a.x+(seg.b.x-seg.a.x)*t,y:seg.a.y+(seg.b.y-seg.a.y)*t}}
function distSegment(px,py,a,b){let dx=b.x-a.x,dy=b.y-a.y,t=Math.max(0,Math.min(1,((px-a.x)*dx+(py-a.y)*dy)/(dx*dx+dy*dy||1)));return Math.hypot(px-a.x-t*dx,py-a.y-t*dy)}
function nearRoad(x,y){return paths.some(p=>p.parts.some(s=>distSegment(x,y,s.a,s.b)<43))}
function newGame(level,endless=false){paths=makePaths(level).map(segments);let maxhp=100+save.upgrades.hp*20;game={level,endless,gold:230+save.upgrades.gold*35,hp:maxhp,maxhp,wave:0,active:false,queue:[],spawnClock:0,enemies:[],towers:[],shots:[],particles:[],cool:{air:0,freeze:0,heal:0},frozen:0,score:0,kills:0,paused:false,finished:false,elapsed:0};cam={x:0,y:0,z:1};selected=null;power=null;buildType='arrow';scene='game';overlay.style.display='none';hud.style.display='flex';bottom.style.display='flex';panel.style.display='none';drawButtons();syncHud();notify('اضغط خارج الطريق لبناء برج، ثم ابدأ الموجة');persistRun()}
function persistRun(){if(game&&!game.finished){save.run={...game,paths:undefined};persist()}}
function resume(){let r=save.run;if(!r)return;newGame(r.level,r.endless);Object.assign(game,r);if(!game.endless&&game.wave>=WAVES_PER_LEVEL){game.wave=WAVES_PER_LEVEL-1;game.active=false;game.queue=[];game.enemies=[];game.shots=[];game.particles=[];}paths=makePaths(game.level).map(segments);game.paused=true;syncHud();notify('تم استرجاع المباراة — اضغط استئناف')}
function drawButtons(){bottom.innerHTML='';for(let t of TYPES){let b=document.createElement('button');b.textContent=worldFor(game.level).units[TYPES.indexOf(t)]+' '+t.cost+'💰';b.disabled=game.level<t.unlock;b.title=t.unlock>game.level?'يفتح في المرحلة '+t.unlock:'';b.className=buildType===t.id&&!power?'active':'';b.onclick=()=>{buildType=t.id;power=null;selected=null;panel.style.display='none';drawButtons()};bottom.appendChild(b)}for(let [id,name] of [['air','✈ قصف'],['freeze','❄ تجميد'],['heal','❤ إصلاح']]){let b=document.createElement('button');b.id='power-'+id;b.textContent=name;b.className=power===id?'active':'';b.onclick=()=>{if(game.cool[id]>0){notify('القدرة تنتظر '+Math.ceil(game.cool[id])+' ثانية');return}if(id==='freeze'||id==='heal'){activatePower(id)}else{power=id;selected=null;panel.style.display='none';drawButtons();notify('اضغط على مكان القصف')}};bottom.appendChild(b)} }
function syncHud(){if(!game)return;$('#stats').textContent=`🏰 ${Math.ceil(game.hp)}/${game.maxhp}   💰 ${Math.floor(game.gold)}   🏹 ${game.towers.length}`;$('#wave').textContent=`${worldFor(game.level).name} • ${game.endless?'لا نهائي':'مرحلة '+game.level} • موجة ${game.wave}/${game.endless?'∞':WAVES_PER_LEVEL}`;$('#startWave').disabled=game.active||game.paused||game.finished||(!game.endless&&game.wave>=WAVES_PER_LEVEL);$('#startWave').textContent=(!game.endless&&[4,9].includes(game.wave))?'⚔ موجة الزعيم ▶':'▶ ابدأ الموجة';$('#pause').textContent=game.paused?'▶ استئناف':'⏸ إيقاف';for(let id of ['air','freeze','heal']){let b=$('#power-'+id);if(b){b.disabled=game.cool[id]>0;b.title=game.cool[id]>0?'انتظار '+Math.ceil(game.cool[id]):''}}}
function notify(s){let t=$('#toast');t.textContent=s;t.style.display='block';toastTimer=3.3}
function startWave(){if(!game||game.active||game.paused||game.finished||(!game.endless&&game.wave>=WAVES_PER_LEVEL))return;game.wave++;game.active=true;let w=game.wave,qty=Math.min(65,10+w*3),r=rnd(w*97+game.level*47);game.queue=[];for(let i=0;i<qty;i++){let type='normal',p=r();if(w%5===0&&i===qty-1)type='boss';else if(w>7&&p>.82)type='hidden';else if(w>5&&p>.66)type='flying';else if(w>3&&p>.48)type='armored';else if(w>1&&p>.28)type='fast';game.queue.push({type,path:i%paths.length,delay:i*.52})}game.spawnClock=0;syncHud()}
function spawn(spec){let base=ENEMIES[spec.type],factor=1+(game.level-1)*.14+(game.wave-1)*.15;game.enemies.push({type:spec.type,path:spec.path,d:0,hp:base.hp*factor,maxhp:base.hp*factor,speed:base.speed,armor:base.armor,reward:base.reward,damage:base.damage,x:0,y:0,burn:0,slow:0,phase:Math.random()*6})}
function validBuild(x,y){if(x<38||x>W-115||y<45||y>H-45)return false;if(nearRoad(x,y))return false;if(Math.hypot(x-938,y-325)<85)return false;return !game.towers.some(t=>Math.hypot(x-t.x,y-t.y)<48)}
function build(x,y){let t=TYPES.find(t=>t.id===buildType);if(game.level<t.unlock)return notify('البرج يفتح في المرحلة '+t.unlock);if(game.gold<t.cost)return notify('الذهب غير كافٍ');if(!validBuild(x,y))return notify('اختر أرضًا فارغة بعيدًا عن الطريق والأبراج');game.gold-=t.cost;game.towers.push({x,y,type:t.id,level:1,spent:t.cost,cd:0});sfx('build');selected=game.towers.at(-1);showTower();syncHud();persistRun()}
function showTower(){if(!selected)return;let t=TYPES.find(x=>x.id===selected.type),cost=Math.floor(t.cost*(.8+selected.level*.65));panel.style.display='block';panel.innerHTML=`<b>⚔️ ${worldFor(game.level).units[TYPES.indexOf(t)]} (${t.name}) — مستوى ${selected.level}/5</b><p>الضرر: ${Math.round(t.damage*(1+(selected.level-1)*.5))} • المدى: ${Math.round(t.range+(selected.level-1)*10)}</p><button id="upgrade">⬆ تطوير ${cost}💰</button><button id="sell">بيع ${Math.floor(selected.spent*.7)}💰</button><button id="closePanel">إغلاق</button>`;$('#upgrade').disabled=selected.level>=5||game.gold<cost;$('#upgrade').onclick=()=>{if(selected.level>=5||game.gold<cost)return;game.gold-=cost;selected.spent+=cost;selected.level++;showTower();syncHud();persistRun()};$('#sell').onclick=()=>{game.gold+=Math.floor(selected.spent*.7);game.towers.splice(game.towers.indexOf(selected),1);selected=null;panel.style.display='none';syncHud();persistRun()};$('#closePanel').onclick=()=>{selected=null;panel.style.display='none'}}
function activatePower(id,x=0,y=0){if(game.cool[id]>0)return;game.cool[id]=id==='air'?35:id==='freeze'?45:55;if(id==='air'){for(let e of game.enemies){if(Math.hypot(e.x-x,e.y-y)<145)e.hp-=200+game.level*12}burst(x,y,'#ffae55',35)}if(id==='freeze'){game.frozen=6;notify('❄ تم تجميد الأعداء 6 ثوانٍ')}if(id==='heal'){game.hp=Math.min(game.maxhp,game.hp+35);notify('❤ تم إصلاح القلعة')}sfx('power');power=null;drawButtons();syncHud()}
function shoot(t,e){
 const base=TYPES.find(z=>z.id===t.type),damage=base.damage*(1+(t.level-1)*.5)*(1+save.upgrades.damage*.06);
 let targets=[e],impact=0;
 if(t.type==='cannon'||t.type==='fire'){impact=t.type==='cannon'?52:35;targets=game.enemies.filter(z=>z.hp>0&&Math.hypot(z.x-e.x,z.y-e.y)<impact)}
 if(t.type==='electric'){targets=game.enemies.filter(z=>z.hp>0&&Math.hypot(z.x-e.x,z.y-e.y)<75).slice(0,Math.min(6,2+t.level))}
 for(let z of targets){let dmg=damage*(z.type==='armored'&&t.type!=='cannon'?1-z.armor:1);z.hp-=dmg;if(t.type==='ice')z.slow=2.4;if(t.type==='fire')z.burn=3.5}
 let duration=t.type==='electric'?.2:t.type==='sniper'?.14:.35;
 game.shots.push({x:t.x,y:t.y-24,tx:e.x,ty:e.y,life:duration,maxLife:duration,color:base.color,type:t.type,level:t.level,chains:t.type==='electric'?targets.map(z=>({x:z.x,y:z.y})):[]});
 if(t.type==='cannon')burst(e.x,e.y,'#ffba68',8);
 if(t.type==='fire')burst(e.x,e.y,'#ff7839',Math.min(12,3+t.level*2));
 if(t.type==='ice')burst(e.x,e.y,'#b6f3ff',Math.min(10,2+t.level));
 if(t.type==='electric')burst(e.x,e.y,'#d7aaff',4);
 sfx('hit');
}
function burst(x,y,color,n){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=20+Math.random()*85;game.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.35+Math.random()*.5,color})}}
function update(dt){if(!game||game.paused||game.finished)return;game.elapsed+=dt;for(let id of Object.keys(game.cool))game.cool[id]=Math.max(0,game.cool[id]-dt);game.frozen=Math.max(0,game.frozen-dt);if(game.active){game.spawnClock+=dt;while(game.queue.length&&game.queue[0].delay<=game.spawnClock){spawn(game.queue.shift())}}
for(let e of game.enemies){let speed=e.speed*(e.slow>0?.55:1)*(game.frozen>0?.1:1);e.d+=speed*dt;e.slow=Math.max(0,e.slow-dt);if(e.burn>0){e.hp-=8*dt;e.burn-=dt}let pos=atPath(paths[e.path],e.d);e.x=pos.x;e.y=pos.y;e.phase+=dt*8;if(e.d>=paths[e.path].total){game.hp=Math.max(0,game.hp-e.damage);e.hp=-999;if(game.hp<=0){endGame(false);return}}}
for(let t of game.towers){t.cd-=dt;if(t.cd>0)continue;let base=TYPES.find(z=>z.id===t.type),range=base.range+(t.level-1)*10;let possible=game.enemies.filter(e=>e.hp>0&&Math.hypot(t.x-e.x,t.y-e.y)<=range&&(e.type!=='hidden'||t.type==='electric'||t.type==='sniper')&&(e.type!=='flying'||['arrow','electric','sniper','ice'].includes(t.type)));possible.sort((a,b)=>b.d-a.d);if(possible.length){shoot(t,possible[0]);t.cd=base.rate/(1+(t.level-1)*.12)}}
for(let i=game.enemies.length-1;i>=0;i--){let e=game.enemies[i];if(e.hp<=0){if(e.hp!==-999){game.gold+=e.reward;game.kills++;game.score+=e.reward;burst(e.x,e.y,'#ffdf81',6)}game.enemies.splice(i,1)}}for(let s of game.shots)s.life-=dt;game.shots=game.shots.filter(s=>s.life>0);for(let p of game.particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}game.particles=game.particles.filter(p=>p.life>0);if(game.active&&!game.queue.length&&!game.enemies.length){game.active=false;game.gold+=40+game.wave*5;notify('🎉 انتهت الموجة! مكافأة الذهب');persistRun();if(game.wave>=WAVES_PER_LEVEL&&!game.endless){endGame(true);return}}if(Math.floor(game.elapsed)%2===0)syncHud()}

  if(progress>.82){ctx.strokeStyle='#ff9a4b';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,20+(progress-.82)*85,0,7);ctx.stroke()}
 }else if(s.type==='ice'){
  ctx.translate(x,y);ctx.rotate(progress*7);ctx.shadowColor='#8deaff';ctx.shadowBlur=10;polygon(0,0,11,4,'#d7f9ff');polygon(0,0,5,4,'#62caff');
 }else if(s.type==='cannon'){
  ctx.translate(x,y);ctx.shadowColor='#ff9b54';ctx.shadowBlur=12;ctx.fillStyle='#343b48';ctx.beginPath();ctx.arc(0,0,7,0,7);ctx.fill();ctx.fillStyle='#ffb45c';ctx.beginPath();ctx.arc(-3,-3,3,0,7);ctx.fill();
 }else{
  ctx.translate(x,y);ctx.rotate(Math.atan2(s.ty-s.y,s.tx-s.x));ctx.strokeStyle='#c5f5ce';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-10,0);ctx.lineTo(10,0);ctx.stroke();ctx.fillStyle='#b9f7b8';polygon(11,0,6,3,'#b9f7b8');
 }
 ctx.restore();
}for(let p of game.particles){ctx.globalAlpha=Math.min(1,p.life*2);ctx.fillStyle=p.color;ctx.fillRect(p.x-3,p.y-3,6,6)}ctx.globalAlpha=1;
ctx.restore();if(toastTimer>0){toastTimer-=1/60;if(toastTimer<=0)$('#toast').style.display='none'}}
function loop(t){let dt=Math.min(.05,(t-last)/1000||0);last=t;try{update(dt);draw()}catch(e){console.error(e);if(game)game.paused=true;notify('حدث خطأ في التشغيل: '+e.message)}requestAnimationFrame(loop)}home();requestAnimationFrame(loop);setInterval(()=>{if(game&&!game.finished)persistRun()},7000);
</script></body></html>
