<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#111b29"><title>دفاع القلعة V1.1</title><style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#f7f2df;font-family:system-ui,Tahoma,sans-serif;overflow:hidden;touch-action:none}button{font:inherit;cursor:pointer;border:1px solid #536779;border-radius:10px;background:#293e55;color:white;padding:9px 12px}button:disabled{opacity:.35}button.active{background:#d49c38;color:#172231;border-color:#ffe3a2}button:active{transform:scale(.97)}#game{width:100vw;height:100dvh;display:block;touch-action:none}#hud{position:absolute;top:7px;left:7px;right:7px;display:none;align-items:center;gap:6px;flex-wrap:wrap;pointer-events:none}#hud>*{pointer-events:auto} .pill{background:#17283be9;border:1px solid #5d7482;border-radius:9px;padding:7px 10px;font-weight:700;font-size:13px}#bottom{position:absolute;bottom:8px;left:8px;right:8px;display:none;justify-content:center;gap:5px;flex-wrap:wrap;background:#152338e8;border:1px solid #526578;border-radius:14px;padding:7px}#bottom button{font-size:12px;padding:8px 9px}#panel{position:absolute;top:57px;right:8px;background:#142438f2;border:1px solid #6d8191;border-radius:12px;padding:12px;width:min(270px,48vw);display:none;z-index:4;font-size:13px;box-shadow:0 8px 28px #0008}#panel button{margin:3px}#overlay{position:absolute;inset:0;background:#08111cdb;display:flex;align-items:center;justify-content:center;z-index:10;overflow:auto;padding:18px}#modal{width:min(760px,96vw);max-height:95dvh;overflow:auto;background:linear-gradient(140deg,#1e364b,#101c30);border:2px solid #b88e4b;border-radius:20px;padding:20px;text-align:center;box-shadow:0 15px 50px #0009}h1{color:#ffd27a;margin:3px 0 8px}h2{color:#ffe2a6;margin:9px 0}p{line-height:1.7}.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:12px 0}.levels button{min-height:48px}.bar{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:12px}.muted{color:#b6c8d4;font-size:13px}.notice{background:#2c4257;padding:9px;border-radius:9px;margin:8px 0}#toast{position:absolute;top:102px;left:50%;transform:translateX(-50%);background:#18283de8;border:1px solid #b9a06a;border-radius:12px;padding:10px 16px;display:none;z-index:8;pointer-events:none;text-align:center;max-width:75vw}#rotate{display:none;position:absolute;inset:0;z-index:20;background:#0e1b2b;align-items:center;justify-content:center;text-align:center;padding:25px;font-size:22px}@media(orientation:portrait) and (max-width:750px){#rotate{display:flex}}@media(max-height:480px){#hud{gap:3px}.pill{padding:4px 6px;font-size:11px}#bottom{padding:3px}#bottom button{padding:5px;font-size:11px}#panel{top:43px;font-size:11px;padding:7px}}
</style></head><body><canvas id="game"></canvas><div id="hud"><span class="pill" id="stats"></span><span class="pill" id="wave"></span><button id="startWave">▶ ابدأ الموجة</button><button id="pause">⏸ إيقاف</button><button id="menuBtn">☰ القائمة</button></div><div id="panel"></div><div id="bottom"></div><div id="toast"></div><div id="overlay"><div id="modal"></div></div><div id="rotate">📱 لف الجهاز للوضع الأفقي للعب دفاع القلعة 🏰</div><script>
'use strict';
const $=s=>document.querySelector(s),cv=$('#game'),ctx=cv.getContext('2d'),hud=$('#hud'),bottom=$('#bottom'),panel=$('#panel'),overlay=$('#overlay'),modal=$('#modal');
const TYPES=[{id:'arrow',name:'سهام',cost:65,range:118,damage:13,rate:.65,color:'#e7c67d',unlock:1},{id:'cannon',name:'مدفع',cost:110,range:105,damage:37,rate:1.75,color:'#5c6475',unlock:2},{id:'ice',name:'جليد',cost:100,range:108,damage:7,rate:.9,color:'#70d6ff',unlock:4},{id:'fire',name:'نار',cost:135,range:100,damage:12,rate:.48,color:'#ff8946',unlock:7},{id:'electric',name:'كهرباء',cost:160,range:122,damage:24,rate:1.2,color:'#d7aaff',unlock:11},{id:'sniper',name:'قناص',cost:185,range:210,damage:92,rate:2.4,color:'#b3e6a5',unlock:15}];
const ENEMIES={normal:{hp:52,speed:39,armor:0,reward:9,color:'#d44c4c',damage:5},fast:{hp:36,speed:68,armor:0,reward:11,color:'#f3a93c',damage:4},armored:{hp:135,speed:25,armor:.38,reward:18,color:'#858a98',damage:10},flying:{hp:78,speed:53,armor:0,reward:15,color:'#c68be3',damage:7},hidden:{hp:62,speed:57,armor:0,reward:16,color:'#68c7a1',damage:6},boss:{hp:730,speed:19,armor:.23,reward:140,color:'#9d3a5b',damage:25}};
const STORE='castle_defense_ar_v1';let save;try{save=JSON.parse(localStorage.getItem(STORE))||{unlocked:1,stars:{},upgrades:{hp:0,gold:0,damage:0},endless:false}}catch(e){save={unlocked:1,stars:{},upgrades:{hp:0,gold:0,damage:0},endless:false}};save.upgrades||={hp:0,gold:0,damage:0};save.stars||={};
function persist(){try{localStorage.setItem(STORE,JSON.stringify(save))}catch(e){}}
let fxSoundLast=0;let game=null,scene='menu',last=0,scale=1,offX=0,offY=0,cam={x:0,y:0,z:1},drag=null,buildType='arrow',selected=null,power=null,audio=null,soundOn=true,toastTimer=0;
const W=1000,H=650;let paths=[];const rnd=(seed)=>{let t=seed+0x6D2B79F5;return()=>{t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}};
function makePaths(level){let r=rnd(level*981+22),n=level<=5?1:level<=12?2:3,res=[];for(let j=0;j<n;j++){let y0=n===1?280:(j+.5)*H/n,points=[{x:-30,y:y0}];for(let k=1;k<=5;k++){let x=80+k*140,y=y0+Math.sin((k+j*1.3)*1.65+level)*65+(r()-.5)*75;y=Math.max(75,Math.min(H-75,y));points.push({x,y})}points.push({x:945,y:325});res.push(points)}return res}
function segments(p){let a=[],sum=0;for(let i=1;i<p.length;i++){let len=Math.hypot(p[i].x-p[i-1].x,p[i].y-p[i-1].y);a.push({a:p[i-1],b:p[i],from:sum,len});sum+=len}return{parts:a,total:sum}}
function atPath(path,d){let seg=path.parts.find(s=>d<=s.from+s.len)||path.parts.at(-1),t=Math.max(0,Math.min(1,(d-seg.from)/seg.len));return{x:seg.a.x+(seg.b.x-seg.a.x)*t,y:seg.a.y+(seg.b.y-seg.a.y)*t}}
function distSegment(px,py,a,b){let dx=b.x-a.x,dy=b.y-a.y,t=Math.max(0,Math.min(1,((px-a.x)*dx+(py-a.y)*dy)/(dx*dx+dy*dy||1)));return Math.hypot(px-a.x-t*dx,py-a.y-t*dy)}
function nearRoad(x,y){return paths.some(p=>p.parts.some(s=>distSegment(x,y,s.a,s.b)<43))}
function newGame(level,endless=false){paths=makePaths(level).map(segments);let maxhp=100+save.upgrades.hp*20;game={level,endless,gold:230+save.upgrades.gold*35,hp:maxhp,maxhp,wave:0,active:false,queue:[],spawnClock:0,enemies:[],towers:[],shots:[],particles:[],cool:{air:0,freeze:0,heal:0},frozen:0,score:0,kills:0,paused:false,finished:false,elapsed:0};cam={x:0,y:0,z:1};selected=null;power=null;buildType='arrow';scene='game';overlay.style.display='none';hud.style.display='flex';bottom.style.display='flex';panel.style.display='none';drawButtons();syncHud();notify('اضغط خارج الطريق لبناء برج، ثم ابدأ الموجة');persistRun()}
function persistRun(){if(game&&!game.finished){save.run={...game,paths:undefined};persist()}}
function resume(){let r=save.run;if(!r)return;newGame(r.level,r.endless);Object.assign(game,r);paths=makePaths(game.level).map(segments);game.paused=true;syncHud();notify('تم استرجاع المباراة — اضغط استئناف')}
function drawButtons(){bottom.innerHTML='';for(let t of TYPES){let b=document.createElement('button');b.textContent=t.name+' '+t.cost+'💰';b.disabled=game.level<t.unlock;b.title=t.unlock>game.level?'يفتح في المرحلة '+t.unlock:'';b.className=buildType===t.id&&!power?'active':'';b.onclick=()=>{buildType=t.id;power=null;selected=null;panel.style.display='none';drawButtons()};bottom.appendChild(b)}for(let [id,name] of [['air','✈ قصف'],['freeze','❄ تجميد'],['heal','❤ إصلاح']]){let b=document.createElement('button');b.id='power-'+id;b.textContent=name;b.className=power===id?'active':'';b.onclick=()=>{if(game.cool[id]>0){notify('القدرة تنتظر '+Math.ceil(game.cool[id])+' ثانية');return}if(id==='freeze'||id==='heal'){activatePower(id)}else{power=id;selected=null;panel.style.display='none';drawButtons();notify('اضغط على مكان القصف')}};bottom.appendChild(b)} }
function syncHud(){if(!game)return;$('#stats').textContent=`🏰 ${Math.ceil(game.hp)}/${game.maxhp}   💰 ${Math.floor(game.gold)}   🏹 ${game.towers.length}`;$('#wave').textContent=`${game.endless?'لا نهائي':'مرحلة '+game.level} • موجة ${game.wave}/${game.endless?'∞':20}`;$('#startWave').disabled=game.active||game.paused||game.finished;$('#pause').textContent=game.paused?'▶ استئناف':'⏸ إيقاف';for(let id of ['air','freeze','heal']){let b=$('#power-'+id);if(b){b.disabled=game.cool[id]>0;b.title=game.cool[id]>0?'انتظار '+Math.ceil(game.cool[id]):''}}}
function notify(s){let t=$('#toast');t.textContent=s;t.style.display='block';toastTimer=3.3}
function startWave(){if(!game||game.active||game.paused)return;game.wave++;game.active=true;let w=game.wave,qty=Math.min(65,9+w*2),r=rnd(w*97+game.level*47);game.queue=[];for(let i=0;i<qty;i++){let type='normal',p=r();if(w%5===0&&i===qty-1)type='boss';else if(w>12&&p>.82)type='hidden';else if(w>8&&p>.66)type='flying';else if(w>5&&p>.48)type='armored';else if(w>2&&p>.28)type='fast';game.queue.push({type,path:i%paths.length,delay:i*.52})}game.spawnClock=0;syncHud()}
function spawn(spec){let base=ENEMIES[spec.type],factor=1+(game.level-1)*.14+(game.wave-1)*.105;game.enemies.push({type:spec.type,path:spec.path,d:0,hp:base.hp*factor,maxhp:base.hp*factor,speed:base.speed,armor:base.armor,reward:base.reward,damage:base.damage,x:0,y:0,burn:0,slow:0,phase:Math.random()*6})}
function validBuild(x,y){if(x<38||x>W-115||y<45||y>H-45)return false;if(nearRoad(x,y))return false;if(Math.hypot(x-938,y-325)<85)return false;return !game.towers.some(t=>Math.hypot(x-t.x,y-t.y)<48)}
function build(x,y){let t=TYPES.find(t=>t.id===buildType);if(game.level<t.unlock)return notify('البرج يفتح في المرحلة '+t.unlock);if(game.gold<t.cost)return notify('الذهب غير كافٍ');if(!validBuild(x,y))return notify('اختر أرضًا فارغة بعيدًا عن الطريق والأبراج');game.gold-=t.cost;game.towers.push({x,y,type:t.id,level:1,spent:t.cost,cd:0});sfx('build');selected=game.towers.at(-1);showTower();syncHud();persistRun()}
function showTower(){if(!selected)return;let t=TYPES.find(x=>x.id===selected.type),cost=Math.floor(t.cost*(.8+selected.level*.65));panel.style.display='block';panel.innerHTML=`<b>🏰 برج ${t.name} — مستوى ${selected.level}/5</b><p>الضرر: ${Math.round(t.damage*(1+(selected.level-1)*.5))} • المدى: ${Math.round(t.range+(selected.level-1)*10)}</p><button id="upgrade">⬆ تطوير ${cost}💰</button><button id="sell">بيع ${Math.floor(selected.spent*.7)}💰</button><button id="closePanel">إغلاق</button>`;$('#upgrade').disabled=selected.level>=5||game.gold<cost;$('#upgrade').onclick=()=>{if(selected.level>=5||game.gold<cost)return;game.gold-=cost;selected.spent+=cost;selected.level++;showTower();syncHud();persistRun()};$('#sell').onclick=()=>{game.gold+=Math.floor(selected.spent*.7);game.towers.splice(game.towers.indexOf(selected),1);selected=null;panel.style.display='none';syncHud();persistRun()};$('#closePanel').onclick=()=>{selected=null;panel.style.display='none'}}
function activatePower(id,x=0,y=0){if(game.cool[id]>0)return;game.cool[id]=id==='air'?35:id==='freeze'?45:55;if(id==='air'){for(let e of game.enemies){if(Math.hypot(e.x-x,e.y-y)<145)e.hp-=200+game.level*12}burst(x,y,'#ffae55',35)}if(id==='freeze'){game.frozen=6;notify('❄ تم تجميد الأعداء 6 ثوانٍ')}if(id==='heal'){game.hp=Math.min(game.maxhp,game.hp+35);notify('❤ تم إصلاح القلعة')}sfx('power');power=null;drawButtons();syncHud()}
function shoot(t,e,typ){let base=TYPES.find(z=>z.id===t.type),damage=base.damage*(1+(t.level-1)*.5)*(1+save.upgrades.damage*.06);let targets=[e];if(t.type==='cannon'||t.type==='electric')targets=game.enemies.filter(z=>Math.hypot(z.x-e.x,z.y-e.y)<(t.type==='cannon'?52:72)).slice(0,t.type==='electric'?4:12);for(let z of targets){let dmg=damage*(z.type==='armored'&&t.type!=='cannon'?1-z.armor:1);z.hp-=dmg;if(t.type==='ice')z.slow=2.4;if(t.type==='fire')z.burn=3.5}game.shots.push({x:t.x,y:t.y,tx:e.x,ty:e.y,life:.2,color:base.color});sfx('hit');if(t.type==='cannon')burst(e.x,e.y,'#ffba68',8)}
function burst(x,y,color,n){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=20+Math.random()*85;game.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.35+Math.random()*.5,color})}}
function update(dt){if(!game||game.paused||game.finished)return;game.elapsed+=dt;for(let id of Object.keys(game.cool))game.cool[id]=Math.max(0,game.cool[id]-dt);game.frozen=Math.max(0,game.frozen-dt);if(game.active){game.spawnClock+=dt;while(game.queue.length&&game.queue[0].delay<=game.spawnClock){spawn(game.queue.shift())}}
for(let e of game.enemies){let speed=e.speed*(e.slow>0?.55:1)*(game.frozen>0?.1:1);e.d+=speed*dt;e.slow=Math.max(0,e.slow-dt);if(e.burn>0){e.hp-=8*dt;e.burn-=dt}let pos=atPath(paths[e.path],e.d);e.x=pos.x;e.y=pos.y;e.phase+=dt*8;if(e.d>=paths[e.path].total){game.hp=Math.max(0,game.hp-e.damage);e.hp=-999;if(game.hp<=0){endGame(false);return}}}
for(let t of game.towers){t.cd-=dt;if(t.cd>0)continue;let base=TYPES.find(z=>z.id===t.type),range=base.range+(t.level-1)*10;let possible=game.enemies.filter(e=>e.hp>0&&Math.hypot(t.x-e.x,t.y-e.y)<=range&&(e.type!=='hidden'||t.type==='electric'||t.type==='sniper')&&(e.type!=='flying'||['arrow','electric','sniper','ice'].includes(t.type)));possible.sort((a,b)=>b.d-a.d);if(possible.length){shoot(t,possible[0]);t.cd=base.rate/(1+(t.level-1)*.12)}}
for(let i=game.enemies.length-1;i>=0;i--){let e=game.enemies[i];if(e.hp<=0){if(e.hp!==-999){game.gold+=e.reward;game.kills++;game.score+=e.reward;burst(e.x,e.y,'#ffdf81',6)}game.enemies.splice(i,1)}}for(let s of game.shots)s.life-=dt;game.shots=game.shots.filter(s=>s.life>0);for(let p of game.particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}game.particles=game.particles.filter(p=>p.life>0);if(game.active&&!game.queue.length&&!game.enemies.length){game.active=false;game.gold+=40+game.wave*5;notify('🎉 انتهت الموجة! مكافأة الذهب');persistRun();if(game.wave>=20&&!game.endless){endGame(true);return}}if(Math.floor(game.elapsed)%2===0)syncHud()}
function endGame(win){game.finished=true;save.run=null;if(win){let stars=game.hp/game.maxhp>.75?3:game.hp/game.maxhp>.4?2:1;save.stars[game.level]=Math.max(save.stars[game.level]||0,stars);save.unlocked=Math.max(save.unlocked,Math.min(20,game.level+1));if(game.level===20)save.endless=true;save.lastResult={win:true,level:game.level,stars}}else save.lastResult={win:false,level:game.level};persist();scene='result';showModal(`<h1>${win?'🏆 انتصرت!':'💔 سقطت القلعة'}</h1><h2>${win?'⭐'.repeat(save.lastResult.stars):'حاول مرة ثانية'}</h2><p>المرحلة ${game.level} • الأعداء المهزومون ${game.kills}</p><div class="bar"><button onclick="newGame(${game.level},${game.endless})">🔄 إعادة اللعب</button>${win&&game.level<20?`<button onclick="newGame(${game.level+1})">المرحلة التالية ▶</button>`:''}<button onclick="home()">القائمة الرئيسية</button></div>`) }
function showModal(html){overlay.style.display='flex';modal.innerHTML=html}
function home(){scene='menu';game=null;hud.style.display='none';bottom.style.display='none';panel.style.display='none';showModal(`<h1>🏰 دفاع القلعة</h1><p>ابنِ دفاعاتك، وصد 20 موجة في كل مرحلة، وافتح الأبراج والخرائط!</p><div class="bar"><button onclick="levels()">▶ ابدأ اللعب</button>${save.run?'<button onclick="resume()">↩ متابعة المباراة</button>':''}<button onclick="upgrades()">⭐ الترقيات الدائمة</button><button onclick="settings()">⚙ الإعدادات</button>${save.endless?'<button onclick="newGame(20,true)">♾ طور لا نهائي</button>':''}</div><p class="muted">V1.1 • تحسين الرسومات والحركة • حفظ تلقائي</p>`) }
function levels(){scene='levels';let html='<h1>🗺️ اختر المرحلة</h1><div class="levels">';for(let i=1;i<=20;i++){let env=i<=5?'🌲':i<=10?'🏜️':i<=15?'❄️':'🌋';html+=`<button ${i>save.unlocked?'disabled':''} onclick="newGame(${i})">${env} ${i}<br>${'⭐'.repeat(save.stars[i]||0)}</button>`}html+='</div><button onclick="home()">رجوع</button>';showModal(html)}
function starsTotal(){return Object.values(save.stars).reduce((a,b)=>a+b,0)}function starsSpent(){return Object.values(save.upgrades).reduce((a,b)=>a+b,0)*3}function upgrades(){let available=starsTotal()-starsSpent(),html=`<h1>⭐ الترقيات الدائمة</h1><p>النجوم المتاحة: ${available} من ${starsTotal()}</p>`;for(let [id,name] of [['hp','صحة القلعة +20'],['gold','ذهب البداية +35'],['damage','قوة الأبراج +6%']])html+=`<p>${name} — مستوى ${save.upgrades[id]}/5 <button ${available<3||save.upgrades[id]>=5?'disabled':''} onclick="buyUpgrade('${id}')">ترقية (3 ⭐)</button></p>`;showModal(html+'<button onclick="home()">رجوع</button>')}
function buyUpgrade(id){if(starsTotal()-starsSpent()<3||save.upgrades[id]>=5)return;save.upgrades[id]++;persist();upgrades()}
function settings(){showModal(`<h1>⚙ الإعدادات</h1><p><button onclick="soundOn=!soundOn;settings()">الصوت: ${soundOn?'مفعل 🔊':'مكتوم 🔇'}</button></p><p class="muted">حرك الخريطة بالسحب • قرّب بإصبعين • اضغط خارج الطريق لبناء برج</p><button onclick="home()">رجوع</button>`)}
function inGameMenu(){if(!game)return;game.paused=true;syncHud();showModal(`<h1>⏸ إيقاف مؤقت</h1><p>المرحلة ${game.level} — الموجة ${game.wave}</p><div class="bar"><button onclick="overlay.style.display='none';game.paused=false;syncHud()">▶ متابعة</button><button onclick="persistRun();home()">💾 حفظ والعودة للقائمة</button><button onclick="if(confirm('إعادة المرحلة من البداية؟'))newGame(${game.level},${game.endless})">🔄 إعادة المرحلة</button></div>`)}
$('#startWave').onclick=()=>{if(game&&!game.active){let bonus=Math.max(0,Math.floor(12+game.wave*2));game.gold+=bonus;startWave()}};$('#pause').onclick=()=>{game.paused=!game.paused;syncHud()};$('#menuBtn').onclick=inGameMenu;
function resize(){let dpr=Math.min(2,devicePixelRatio||1);cv.width=Math.round(innerWidth*dpr);cv.height=Math.round(innerHeight*dpr);cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';scale=Math.min(cv.width/W,cv.height/H);offX=(cv.width-W*scale)/2;offY=(cv.height-H*scale)/2}
addEventListener('resize',resize);resize();
function pointerPos(e){let r=cv.getBoundingClientRect(),sx=(e.clientX-r.left)*cv.width/r.width,sy=(e.clientY-r.top)*cv.height/r.height;return{x:(sx-offX)/scale,y:(sy-offY)/scale}}
function world(p){return{x:(p.x-W/2)/cam.z+W/2-cam.x,y:(p.y-H/2)/cam.z+H/2-cam.y}}
cv.addEventListener('pointerdown',e=>{if(scene!=='game'||game.paused)return;cv.setPointerCapture(e.pointerId);let p=pointerPos(e);drag={id:e.pointerId,p,last:p,moved:false}});cv.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;let p=pointerPos(e);if(Math.hypot(p.x-drag.p.x,p.y-drag.p.y)>7)drag.moved=true;if(drag.moved){cam.x+=(p.x-drag.last.x)/cam.z;cam.y+=(p.y-drag.last.y)/cam.z;cam.x=Math.max(-250,Math.min(250,cam.x));cam.y=Math.max(-180,Math.min(180,cam.y))}drag.last=p});cv.addEventListener('pointerup',e=>{if(!drag||drag.id!==e.pointerId)return;let moved=drag.moved,p=world(pointerPos(e));drag=null;if(moved||!game||game.paused||game.finished)return;if(power==='air'){activatePower('air',p.x,p.y);return}let t=game.towers.find(t=>Math.hypot(t.x-p.x,t.y-p.y)<26);if(t){selected=t;showTower();return}selected=null;panel.style.display='none';build(p.x,p.y)});cv.addEventListener('wheel',e=>{e.preventDefault();cam.z=Math.max(.7,Math.min(1.8,cam.z*(e.deltaY>0?.9:1.1)))},{passive:false});let touches={};cv.addEventListener('touchstart',e=>{if(e.touches.length===2){touches.pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)}},{passive:true});cv.addEventListener('touchmove',e=>{if(e.touches.length===2&&touches.pinch){let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);cam.z=Math.max(.7,Math.min(1.8,cam.z*d/touches.pinch));touches.pinch=d;drag=null}},{passive:true});
function sfx(kind){if(!soundOn)return;let now=performance.now();if(kind==='hit'&&now-fxSoundLast<110)return;fxSoundLast=now;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type=kind==='hit'?'triangle':'sine';o.frequency.setValueAtTime(kind==='hit'?230:kind==='build'?520:330,t);o.frequency.exponentialRampToValueAtTime(kind==='hit'?90:kind==='build'?790:180,t+.12);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(kind==='hit'?.025:.065,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.16);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.17)}catch(e){}}
function shade(c,k){let v=parseInt(c.slice(1),16),a=[v>>16&255,v>>8&255,v&255].map(x=>Math.max(0,Math.min(255,Math.round(x*k))));return 'rgb('+a.join(',')+')'}
function isoBlock(x,y,w,h,depth,front,top){ctx.fillStyle='#17202a55';ctx.beginPath();ctx.ellipse(x+3,y+5,w*.8,8,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=shade(front,.67);ctx.beginPath();ctx.moveTo(x-w/2,y-h);ctx.lineTo(x,y-h+depth);ctx.lineTo(x,y+depth);ctx.lineTo(x-w/2,y);ctx.closePath();ctx.fill();ctx.fillStyle=front;ctx.beginPath();ctx.moveTo(x,y-h+depth);ctx.lineTo(x+w/2,y-h);ctx.lineTo(x+w/2,y);ctx.lineTo(x,y+depth);ctx.closePath();ctx.fill();ctx.fillStyle=top;ctx.beginPath();ctx.moveTo(x-w/2,y-h);ctx.lineTo(x,y-h-depth*.35);ctx.lineTo(x+w/2,y-h);ctx.lineTo(x,y-h+depth);ctx.closePath();ctx.fill()}
function scenery(x,y,env,r){if(env===0){let h=15+r*18;ctx.fillStyle='#3c603d';ctx.fillRect(x-2,y-h*.6,4,h*.65);polygon(x,y-h*.6,10+r*5,7,'#275d42');polygon(x,y-h*.95,8+r*4,7,'#438a59')}else if(env===1){ctx.fillStyle='#91754d';ctx.beginPath();ctx.ellipse(x,y,11,5,0,0,Math.PI*2);ctx.fill();polygon(x,y-4,9,6,'#dfc48c')}else if(env===2){polygon(x,y,12,5,'#829eaa');polygon(x,y-7,11,5,'#f3fcff')}else{polygon(x,y,12,6,'#3a3034');polygon(x,y-5,7,5,'#d36b38')}}
function renderTower(t){let typ=TYPES.find(z=>z.id===t.type),h=25+(t.level-1)*6;isoBlock(t.x,t.y,29,h,11,shade(typ.color,.85),typ.color);ctx.fillStyle='#f3e8d0';ctx.fillRect(t.x-3,t.y-h-11,6,9);if(t.type==='arrow'||t.type==='sniper'){ctx.strokeStyle='#4b3424';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(t.x-12,t.y-h-8);ctx.lineTo(t.x+12,t.y-h-8);ctx.stroke()}else if(t.type==='cannon'){ctx.fillStyle='#293340';ctx.fillRect(t.x-5,t.y-h-14,20,8)}else{ctx.fillStyle=typ.color;ctx.beginPath();ctx.arc(t.x,t.y-h-12,7+Math.sin((game.elapsed||0)*4)*2,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#132334';ctx.font='bold 12px sans-serif';ctx.fillText(''+t.level,t.x,t.y-h+1);if(selected===t){ctx.strokeStyle='#f9e68b';ctx.lineWidth=2;ctx.beginPath();ctx.arc(t.x,t.y,typ.range+(t.level-1)*10,0,Math.PI*2);ctx.stroke()}}
function renderEnemy(e){let boss=e.type==='boss',sz=boss?17:e.type==='armored'?12:9,bob=Math.sin(e.phase)*2;ctx.fillStyle='#1b273277';ctx.beginPath();ctx.ellipse(e.x,e.y+5,sz+4,5,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#263242';ctx.lineWidth=boss?5:3;ctx.beginPath();ctx.moveTo(e.x-4,e.y);ctx.lineTo(e.x-6+Math.sin(e.phase)*3,e.y+8);ctx.moveTo(e.x+4,e.y);ctx.lineTo(e.x+6-Math.sin(e.phase)*3,e.y+8);ctx.stroke();ctx.fillStyle=ENEMIES[e.type].color;ctx.fillRect(e.x-sz*.65,e.y-sz+bob,sz*1.3,sz*1.4);ctx.beginPath();ctx.arc(e.x,e.y-sz-5+bob,sz*.7,0,Math.PI*2);ctx.fill();if(e.type==='flying'){ctx.strokeStyle='#f5e6ff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(e.x-7,e.y-10);ctx.lineTo(e.x-23,e.y-17+Math.sin(e.phase)*7);ctx.moveTo(e.x+7,e.y-10);ctx.lineTo(e.x+23,e.y-17+Math.sin(e.phase)*7);ctx.stroke()}ctx.fillStyle='#26323b';ctx.fillRect(e.x-sz,e.y-sz-19,sz*2,5);ctx.fillStyle='#79e77c';ctx.fillRect(e.x-sz,e.y-sz-19,sz*2*Math.max(0,e.hp/e.maxhp),5)}
function polygon(x,y,r,n,color){ctx.fillStyle=color;ctx.beginPath();for(let i=0;i<n;i++){let a=i*Math.PI*2/n-Math.PI/2;ctx[i?'lineTo':'moveTo'](x+Math.cos(a)*r,y+Math.sin(a)*r*.7)}ctx.closePath();ctx.fill()}
function draw(){ctx.clearRect(0,0,cv.width,cv.height);if(scene!=='game'||!game){let g=ctx.createLinearGradient(0,0,0,cv.height);g.addColorStop(0,'#17283b');g.addColorStop(1,'#0b1421');ctx.fillStyle=g;ctx.fillRect(0,0,cv.width,cv.height);return}ctx.fillStyle='#101927';ctx.fillRect(0,0,cv.width,cv.height);ctx.save();ctx.translate(offX+scale*W/2,offY+scale*H/2);ctx.scale(scale*cam.z,scale*cam.z);ctx.translate(-W/2+cam.x,-H/2+cam.y);let env=game.level<=5?0:game.level<=10?1:game.level<=15?2:3;let colors=['#6c9d61','#bfa46b','#b2d3dd','#735b57'];ctx.fillStyle=colors[env];ctx.fillRect(-500,-500,2000,1700);
let r=rnd(game.level*17);for(let i=0;i<110;i++){let x=r()*1000,y=r()*650;if(nearRoad(x,y)||Math.hypot(x-940,y-325)<95)continue;scenery(x,y,env,r())}
for(let p of paths){ctx.lineCap='round';ctx.lineJoin='round';for(let [width,color] of [[55,'#4e463d'],[45,env===2?'#8199a6':'#b59b77'],[33,env===2?'#d7e0e4':'#d6bd91']]){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();p.parts.forEach((s,i)=>{if(!i)ctx.moveTo(s.a.x,s.a.y);ctx.lineTo(s.b.x,s.b.y)});ctx.stroke()}}
// Layered castle and defensive structures
isoBlock(941,360,90,78,20,'#9ba9b6','#d5dce0');isoBlock(914,326,26,88,10,'#8496a6','#d5e0e9');isoBlock(969,326,26,88,10,'#8496a6','#d5e0e9');isoBlock(943,314,35,105,14,'#899cae','#dbe3e8');ctx.fillStyle='#6c3c36';ctx.fillRect(932,328,21,31);ctx.fillStyle='#f7e1a0';ctx.font='bold 17px sans-serif';ctx.textAlign='center';ctx.fillText('🏰',943,201);
for(let t of game.towers)renderTower(t);
for(let e of game.enemies)renderEnemy(e);
for(let s of game.shots){ctx.strokeStyle=s.color;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(s.x,s.y-15);ctx.lineTo(s.tx,s.ty);ctx.stroke()}for(let p of game.particles){ctx.globalAlpha=Math.min(1,p.life*2);ctx.fillStyle=p.color;ctx.fillRect(p.x-3,p.y-3,6,6)}ctx.globalAlpha=1;
ctx.restore();if(toastTimer>0){toastTimer-=1/60;if(toastTimer<=0)$('#toast').style.display='none'}}
function loop(t){let dt=Math.min(.05,(t-last)/1000||0);last=t;try{update(dt);draw()}catch(e){console.error(e);if(game)game.paused=true;notify('حدث خطأ في التشغيل: '+e.message)}requestAnimationFrame(loop)}home();requestAnimationFrame(loop);setInterval(()=>{if(game&&!game.finished)persistRun()},7000);
</script></body></html>
