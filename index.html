(()=>{'use strict';if(!window.THREE){document.getElementById('error').style.display='block';return;}const T=THREE,view=document.getElementById('view'),info=document.getElementById('info');const scene=new T.Scene();scene.background=new T.Color(0x91d9ed);scene.fog=new T.FogExp2(0x91d9ed,.0008);const camera=new T.PerspectiveCamera(48,innerWidth/innerHeight,.1,1000),renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=T.SRGBColorSpace;view.appendChild(renderer.domElement);scene.add(new T.HemisphereLight(0xe7faff,0x4d6751,2.3));const sun=new T.DirectionalLight(0xffedc0,2.4);sun.position.set(-60,90,30);scene.add(sun);const ocean=new T.Mesh(new T.PlaneGeometry(1200,1200),new T.MeshStandardMaterial({color:0x177eaa,roughness:.38,metalness:.12}));ocean.rotation.x=-Math.PI/2;ocean.position.y=-1.2;scene.add(ocean);let group=new T.Group();scene.add(group);let mapData=null,labels=[],pickable=[],selectedCity=null,paused=false,selectedSources=[],armies=[],edges=[],gameEnded=false,aiClock=0;const COLORS=[0x287bff,0xe64b4b,0x8f5ae6,0x36b76b,0xe6ac37,0xd4dce5];let seed=1;function rand(){seed=(Math.imul(1664525,seed)+1013904223)>>>0;return seed/4294967296}function between(a,b){return a+(b-a)*rand()}function mat(c){return new T.MeshStandardMaterial({color:c,roughness:.86,flatShading:true})}const wallMat=mat(0xece2cb),roofMat=mat(0x7a5651),neutralMat=mat(0x8995a1);function mesh(geo,material,x,y,z,parent=group){let m=new T.Mesh(geo,material);m.position.set(x,y,z);parent.add(m);return m}function box(w,h,d,material,x,y,z,parent){return mesh(new T.BoxGeometry(w,h,d),material,x,y,z,parent)}function island(cx,cz,rx,rz,biome){

 let a=between(0,Math.PI*2),r=Math.sqrt(rand())*.72,x=cx+Math.cos(a)*rx*r,z=cz+Math.sin(a)*rz*r;
 if(biome==='tropical'){mesh(new T.CylinderGeometry(.13,.19,1.25,5),mat(0x765338),x,2.35,z);mesh(new T.ConeGeometry(.7,1.65,6),mat(0x287b4c),x,3.55,z)}
 else if(biome==='snow'){mesh(new T.ConeGeometry(.7,1.6,6),mat(0x416c65),x,2.8,z);mesh(new T.ConeGeometry(.43,.72,6),mat(0xf5fbfc),x,3.65,z)}

function city(c){
 const color=c.owner===null?(c.isFortress?0xc18a30:0x929da6):COLORS[c.owner];
 const base=mesh(new T.CylinderGeometry(1.55,1.75,.6,8),mat(color),c.x,2.2,c.z);c.base=base;base.userData.city=c;pickable.push(base);
 const tower=mesh(new T.CylinderGeometry(c.isFortress?1.65:.85,c.isFortress?1.9:1,c.isFortress?3.7:1.9,6),wallMat,c.x,c.isFortress?4.35:3.45,c.z);c.tower=tower;tower.userData.city=c;pickable.push(tower);
 const roof=mesh(new T.ConeGeometry(c.isFortress?2.1:1.15,c.isFortress?2:1.15,6),mat(color),c.x,c.isFortress?7.25:4.95,c.z);c.roof=roof;roof.userData.city=c;pickable.push(roof);
 // A city marker updates as troops are produced; labels appear when zoomed in.
 const canvas=document.createElement('canvas');canvas.width=256;canvas.height=96;const ctx=canvas.getContext('2d');
 const sprite=new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(canvas),depthTest:false,transparent:true}));sprite.position.set(c.x,7,c.z);sprite.scale.set(4.7,1.76,1);group.add(sprite);labels.push(sprite);c.labelCanvas=canvas;c.labelCtx=ctx;c.sprite=sprite;updateCityVisual(c);

}
function upgradeCost(c){return 8+c.level*8+Math.floor(c.level*c.level*1.5)}
function updateCityVisual(c){
 if(!c.labelCtx)return;
 const ctx=c.labelCtx,canvas=c.labelCanvas;ctx.clearRect(0,0,256,96);ctx.fillStyle='#08283de8';ctx.beginPath();ctx.roundRect(8,8,240,80,15);ctx.fill();ctx.strokeStyle=c.owner===null?'#cbd5e1':'#ffffff';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 28px system-ui';ctx.textAlign='center';ctx.fillText(c.troops+'  |  Lv'+c.level,128,61);c.sprite.material.map.needsUpdate=true;
 c.tower.scale.y=1+(c.level-1)*.13;c.tower.position.y=(c.isFortress?4.35:3.45)+(c.level-1)*.125;c.roof.position.y=(c.isFortress?7.25:4.95)+(c.level-1)*.25;
 c.sprite.position.y=(c.isFortress?10:7)+(c.level-1)*.25;const col=c.owner===null?(c.isFortress?0xc18a30:0x929da6):COLORS[c.owner];c.base.material.color.setHex(col);c.roof.material.color.setHex(col);c.base.scale.setScalar(selectedSources.includes(c)?1.3:1);
}
function showCity(c){selectedCity=c;const panel=document.getElementById('cityPanel');panel.style.display='block';document.getElementById('cityTitle').textContent='قلعة '+c.id+' — '+(c.owner===null?'محايدة':c.owner===0?'مدينتك':'كمبيوتر '+c.owner);refreshPanel()}
function refreshPanel(){if(!selectedCity)return;const c=selectedCity;document.getElementById('cityStats').textContent='المستوى '+c.level+' / 10 • الجنود: '+c.troops+(c.owner===null?' • القوة: '+({weak:'ضعيفة',medium:'متوسطة',strong:'قوية',fortress:'القلعة الكبرى'}[c.strength]||'محايدة'):' • إنتاج: '+(c.level/3).toFixed(2)+' جندي/ثانية');const cost=upgradeCost(c);document.getElementById('cityCost').textContent=c.owner===0?(c.level===10?'وصلت للحد الأعلى':'تكلفة التطوير: '+cost+' جندي'):'التطوير متاح لمدنك فقط';const b=document.getElementById('upgradeCity');b.style.display=c.owner===0?'block':'none';b.disabled=c.level>=10||c.troops<cost||paused;b.textContent=c.level>=10?'الحد الأقصى':c.troops<cost?'تحتاج '+cost+' جندي':'تطوير إلى المستوى '+(c.level+1)}
function updateTroops(dt){if(paused||gameEnded||!mapData)return;let changed=false;for(const c of mapData.cities){if(c.owner===null)continue;c.productionProgress+=dt*c.level/3;const produced=Math.floor(c.productionProgress);if(produced){c.productionProgress-=produced;c.troops+=produced;updateCityVisual(c);changed=true}}if(changed)refreshPanel()}
function bridge(a,b){
 // Solid raised stone causeway between island shores, visible above sea level.
 const dx=b.x-a.x,dz=b.z-a.z,length=Math.hypot(dx,dz),ux=dx/length,uz=dz/length;
 const start={x:a.x+ux*(Math.min(a.rx,a.rz)*.93),z:a.z+uz*(Math.min(a.rx,a.rz)*.93)};
 const end={x:b.x-ux*(Math.min(b.rx,b.rz)*.93),z:b.z-uz*(Math.min(b.rx,b.rz)*.93)};
 const span=Math.hypot(end.x-start.x,end.z-start.z);
 if(span<1)return;
 const deck=box(3.6,.65,span,mat(0xb8a18a),(start.x+end.x)/2,1.85,(start.z+end.z)/2);

 for(const side of [-1,1]){const rail=box(.35,.85,span,mat(0x6c7378),(start.x+end.x)/2+side*1.65*uz,2.45,(start.z+end.z)/2-side*1.65*ux);rail.rotation.y=deck.rotation.y;}
}
function generate(){
 seed=(Date.now()>>>0)||1234;paused=false;document.getElementById('pause').textContent='إيقاف مؤقت';gameEnded=false;selectedSources=[];armies.forEach(a=>group.remove(a.mesh));armies=[];edges=[];aiClock=0;
 const size=document.getElementById('size').value;
 const count=Math.floor(between(size==='small'?15:30,size==='small'?26:46));
 scene.remove(group);group=new T.Group();scene.add(group);pickable=[];labels=[];selectedCity=null;
 document.getElementById('cityPanel').style.display='none';document.getElementById('hint').textContent='اختر قلعة زرقاء أو أكثر ثم اضغط قلعة متصلة للهجوم • اضغط قلعتك للتطوير';
 // Five large outer islands around one central fortress island.
 const islands=[];const ring=size==='small'?60:73;
 for(let i=0;i<5;i++){
  const angle=-Math.PI/2+i*Math.PI*2/5;
  islands.push({x:Math.cos(angle)*ring,z:Math.sin(angle)*ring,rx:size==='small'?27:33,rz:size==='small'?27:33,biome:['tropical','desert','snow'][i%3]});
 }
 islands.push({x:0,z:0,rx:size==='small'?24:29,rz:size==='small'?24:29,biome:'desert'});
 const cities=[],outer=count-1;
 const quotas=Array(5).fill(Math.floor(outer/5));for(let i=0;i<outer%5;i++)quotas[i]++;
 for(let i=0;i<5;i++){
  const isl=islands[i],q=quotas[i],slots=[];
  // Distribute castles across the whole island, with a minimum separation.
  for(let k=0;k<600;k++){
   const a=between(0,Math.PI*2),r=Math.sqrt(rand())*.81;
   const x=Math.cos(a)*r*(isl.rx-4),z=Math.sin(a)*r*(isl.rz-4);
   if(slots.every(p=>Math.hypot(x-p.x,z-p.z)>Math.max(8.5,Math.min(13,isl.rx*.36))))slots.push({x,z});
   if(slots.length>=q)break;
  }
  // Stable fallback for unusually dense maps: farthest-point placement.
  while(slots.length<q){let best=null,bestScore=-1;for(let k=0;k<250;k++){
    let a=between(0,Math.PI*2),r=Math.sqrt(rand())*.85,x=Math.cos(a)*r*(isl.rx-3),z=Math.sin(a)*r*(isl.rz-3);
    let score=Math.min(...slots.map(p=>Math.hypot(x-p.x,z-p.z)));
    if(score>bestScore){bestScore=score;best={x,z}}
   }slots.push(best)}
  for(const pos of slots.slice(0,q))cities.push({id:cities.length+1,x:isl.x+pos.x,z:isl.z+pos.z,island:i,owner:null,level:1,strength:['weak','medium','strong'][Math.floor(rand()*3)],troops:0,productionProgress:0,isFortress:false});
 }
 const fort={id:cities.length+1,x:0,z:0,island:5,owner:null,level:10,strength:'fortress',troops:120,productionProgress:0,isFortress:true};cities.push(fort);
 islands.forEach(i=>island(i.x,i.z,i.rx,i.rz,i.biome));
 // Bridges connect each outer island to the central fortress and adjacent islands.
 const connections=[];
 for(let i=0;i<5;i++){connections.push([i,5]);connections.push([i,(i+1)%5]);}

 // Six starting positions distributed over five outer islands; center remains neutral.
 const chosen=[];for(let i=0;i<5;i++)chosen.push(cities.findIndex(c=>c.island===i));
 const extra=cities.findIndex(c=>c.island===0&&c.id!==cities[chosen[0]].id);if(extra>=0)chosen.push(extra);
 chosen.forEach((idx,player)=>{cities[idx].owner=player;cities[idx].strength='starting'});
 cities.forEach(c=>{if(!c.isFortress)c.troops=c.owner!==null?10:({weak:5,medium:12,strong:22}[c.strength]);city(c)});
 // Graph of allowed neighboring castles: nearest-neighbor links within each island,

 const addEdge=(a,b)=>{if(a===b||edges.some(e=>(e[0]===a&&e[1]===b)||(e[0]===b&&e[1]===a)))return;edges.push([a,b])};

 }
 for(const [i,j] of connections){let best=null,bd=Infinity;for(const a of cities.filter(c=>c.island===i))for(const b of cities.filter(c=>c.island===j)){const d=Math.hypot(a.x-b.x,a.z-b.z);if(d<bd){bd=d;best=[a.id,b.id]}}if(best)addEdge(...best)}
 function canAttack(player,targetId,sourceId){const target=cities.find(c=>c.id===targetId);if(!target||target.owner===player)return false;

 mapData={format:'harb-aljuzur-map-v081',seed,size,cityCount:cities.length,islands,cities,connections,edges,playerCount:6,startingCityIds:chosen.map(i=>cities[i].id),rules:{neutralProduction:false,neutralStrengths:['weak','medium','strong'],startingCitiesPerPlayer:1,centralFortressId:fort.id,centralFortressTroops:120,bridgesOnly:true,conquestOrder:'nearest-connected-first'}};

}

function adjacent(a,b){return edges.some(e=>e.includes(a.id)&&e.includes(b.id))}
function updateSelections(){if(!mapData)return;mapData.cities.forEach(updateCityVisual);info.textContent=selectedSources.length?'تم تحديد '+selectedSources.length+' قلعة • اختر قلعة متصلة للهجوم':mapData.cities.length+' قلعة • 5 جزر خارجية + قلعة مركزية • 6 لاعبين'}
function sendAttack(from,to,ratio){if(paused||gameEnded||from.owner===null||!adjacent(from,to)||from===to)return false;
 const n=Math.floor(from.troops*ratio);if(n<1)return false;from.troops-=n;updateCityVisual(from);
 const material=mat(COLORS[from.owner]);const marker=mesh(new T.ConeGeometry(1.1,2,5),material,from.x,5,from.z);
 armies.push({from,to,owner:from.owner,troops:n,progress:0,mesh:marker});return true}
function attackTarget(target){const sources=selectedSources.filter(c=>c.owner===0&&c!==target&&adjacent(c,target)&&c.troops>0);if(!sources.length){info.textContent='لا يمكن الهجوم: احتل القلاع المتصلة أولًا';return}
 const ratio=Number(document.getElementById('ratio').value);sources.forEach(c=>sendAttack(c,target,ratio));selectedSources=[];updateSelections();showCity(target)}
function chooseCity(c){if(paused||gameEnded){showCity(c);return}
 if(c.owner===0){if(selectedSources.length&&!selectedSources.includes(c)&&selectedSources.some(s=>adjacent(s,c))){attackTarget(c);return;}if(selectedSources.includes(c))selectedSources=selectedSources.filter(s=>s!==c);else selectedSources.push(c);updateSelections();showCity(c)}
 else if(selectedSources.length)attackTarget(c);else showCity(c)}
function resolveArmy(a){const c=a.to;if(c.owner===a.owner){c.troops+=a.troops}
 else {const defense=Math.ceil(c.troops*(1+(c.level-1)*.055));if(a.troops>defense){c.owner=a.owner;c.troops=a.troops-defense;c.productionProgress=0}else{c.troops=Math.max(0,c.troops-Math.ceil(a.troops/(1+(c.level-1)*.055)))}}
 updateCityVisual(c);if(selectedCity===c)refreshPanel();checkEnd()}
function checkEnd(){const owned=mapData.cities.filter(c=>c.owner===0),flying=armies.some(a=>a.owner===0);if(!owned.length&&!flying){finish('خسرت المعركة! ابدأ خريطة جديدة للمحاولة مرة أخرى.');return}
 if(mapData.cities.every(c=>c.owner===0)&&!armies.some(a=>a.owner!==0))finish('انتصرت! سيطرت على جميع القلاع.')}
function finish(msg){gameEnded=true;info.textContent=msg;document.getElementById('hint').textContent=msg}
function tickArmies(dt){if(paused||gameEnded)return;for(let i=armies.length-1;i>=0;i--){const a=armies[i],d=Math.hypot(a.from.x-a.to.x,a.from.z-a.to.z);a.progress+=dt*12/Math.max(6,d);const t=Math.min(1,a.progress);a.mesh.position.set(a.from.x+(a.to.x-a.from.x)*t,5,a.from.z+(a.to.z-a.from.z)*t);if(t>=1){group.remove(a.mesh);armies.splice(i,1);resolveArmy(a);if(gameEnded)break}}}
function aiTurn(dt){if(paused||gameEnded)return;aiClock+=dt;if(aiClock<1.6)return;aiClock=0;
 for(let player=1;player<=5;player++){
 const owned=mapData.cities.filter(c=>c.owner===player);if(!owned.length)continue;
 for(const c of owned){if(c.level<Math.min(6,1+Math.floor(c.troops/35))&&c.troops>upgradeCost(c)+15){c.troops-=upgradeCost(c);c.level++;updateCityVisual(c)}}
 const options=[];for(const c of owned){if(c.troops<12)continue;for(const t of mapData.cities){if(t.owner===player||!adjacent(c,t))continue;const defense=t.troops*(1+(t.level-1)*.055);options.push({c,t,score:c.troops-defense+(t.owner===null?9:0)+rand()*10})}}

let target=new T.Vector3(),yaw=.65,pitch=1.08,dist=175;function resetCamera(){yaw=.65;pitch=1.08;{let bounds=mapData.islands.reduce((b,i)=>({minX:Math.min(b.minX,i.x-i.rx),maxX:Math.max(b.maxX,i.x+i.rx),minZ:Math.min(b.minZ,i.z-i.rz),maxZ:Math.max(b.maxZ,i.z+i.rz)}),{minX:Infinity,maxX:-Infinity,minZ:Infinity,maxZ:-Infinity});target.set((bounds.minX+bounds.maxX)/2,0,(bounds.minZ+bounds.maxZ)/2);const width=bounds.maxX-bounds.minX,depth=bounds.maxZ-bounds.minZ;const aspect=innerWidth/innerHeight;const vfov=camera.fov*Math.PI/180;const visibleHeight=depth*Math.cos(pitch)+width*.18+22;const visibleWidth=width+depth*.16+18;dist=Math.max(visibleHeight/(2*Math.tan(vfov/2)),visibleWidth/(2*Math.tan(vfov/2)*aspect))*1.13;dist=Math.max(dist,115);}updateCamera()}function updateCamera(){pitch=Math.max(.2,Math.min(1.48,pitch));dist=Math.max(20,Math.min(450,dist));camera.position.set(target.x+dist*Math.sin(pitch)*Math.cos(yaw),target.y+dist*Math.cos(pitch),target.z+dist*Math.sin(pitch)*Math.sin(yaw));camera.lookAt(target)}const pointers=new Map();let lastPinch=0,lastMid=null,moved=false;renderer.domElement.addEventListener('pointerdown',e=>{renderer.domElement.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false});renderer.domElement.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const old=pointers.get(e.pointerId);let dx=e.clientX-old.x,dy=e.clientY-old.y;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(Math.abs(dx)+Math.abs(dy)>2)moved=true;if(pointers.size===1){yaw-=dx*.007;pitch-=dy*.006}else if(pointers.size===2){let ps=[...pointers.values()],d=Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y),mid={x:(ps[0].x+ps[1].x)/2,y:(ps[0].y+ps[1].y)/2};if(lastPinch)dist*=lastPinch/d;if(lastMid){let right=new T.Vector3().setFromMatrixColumn(camera.matrix,0);let forward=new T.Vector3();camera.getWorldDirection(forward);forward.y=0;forward.normalize();target.addScaledVector(right,-(mid.x-lastMid.x)*dist/750);target.addSc
