];

C.addEventListener('pointerup',e=>{if(mode!=='city')return;let x=e.clientX/W,y=e.clientY/H;if(cityTool==='signal'||cityTool==='round'){let bi=0,bd=99;J.forEach((j,i)=>{let d=Math.hypot(x-j.x,y-j.y);if(d<bd){bd=d;bi=i}});if(bd<.1){J[bi].type=cityTool;selected=bi}}else{let bi=0,bd=99;R.forEach((r,i)=>{let d=segDist(x,y,r.a.x,r.a.y,r.b.x,r.b.y);if(d<bd){bd=d;bi=i}});if(bd<.09){R[bi].w=cityTool==='highway'?3:Math.max(R[bi].w,2);if(cityTool==='exit')R[bi].exit=true;selected=bi}}});

function spawnCross(seed=false){let ds=['N','S','E','W'],d=ds[Math.floor(Math.random()*4)],m={x:W*.5,y:H*.53},road=Math.max(92,Math.min(145,Math.min(W,H)*.19)),v=d==='N'?[0,1]:d==='S'?[0,-1]:d==='W'?[1,0]:[-1,0],axis=(d==='N'||d==='S')?'NS':'EW',off=(d==='N'||d==='E'?-1:1)*road*.18,x,y;if(d==='N'){x=m.x-off;y=seed?Math.random()*Math.max(20,m.y-road): -24}else if(d==='S'){x=m.x+off;y=seed?m.y+road+Math.random()*Math.max(20,H-m.y-road):H+24}else if(d==='W'){x=seed?Math.random()*Math.max(20,m.x-road):-24;y=m.y+off}else{x=seed?m.x+road+Math.random()*Math.max(20,W-m.x-road):W+24;y=m.y-off}cars.push({id:nextId++,d,axis,dx:v[0],dy:v[1],x,y,v:seed?.25:0,max:.48+Math.random()*.12,c:COLORS[nextId%COLORS.length],wait:0})}
function spawnCity(seed=false){let r=R[Math.floor(Math.random()*R.length)],rev=Math.random()<.5,a=rev?r.b:r.a,b=rev?r.a:r.b,u=seed?Math.random():0,x=W*(a.x+(b.x-a.x)*u),y=H*(a.y+(b.y-a.y)*u),dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx*W,dy*H);dx=dx*W/L;dy=dy*H/L;cars.push({id:nextId++,city:true,road:r,x,y,dx,dy,u,v:.18,max:.34+Math.random()*.1,c:COLORS[nextId%COLORS.length],wait:0,rev})}
function step(dt){t+=dt;if(lock>0)lock-=dt;spawn+=dt;let difficulty=mode==='levels'?stage:1+Math.floor(t/45),interval=mode==='city'?Math.max(.3,.9-t/500):Math.max(.4,1.18-difficulty*.11);while(spawn>interval){spawn-=interval;mode==='city'?spawnCity(false):spawnCross(false)}
for(let i=cars.length-1;i>=0;i--){let c=cars[i],targetV=c.max;if(!c.city){let m={x:W*.5,y:H*.53},road=Math.max(92,Math.min(145,Math.min(W,H)*.19)),stop=c.d==='N'?(m.y-road*.66)-c.y:c.d==='S'?c.y-(m.y+road*.66):c.d==='W'?(m.x-road*.66)-c.x:c.x-(m.x+road*.66),inside=Math.abs(c.x-m.x)<road*.72&&Math.abs(c.y-m.y)<road*.72,green=phase===c.axis&&lock<=0;if(!green&&!inside&&stop>0&&stop<150)targetV=Math.min(targetV,Math.max(0,(stop-12)/115));let gap=frontGap(c);if(gap<60)targetV=Math.min(targetV,Math.max(0,(gap-26)/85));c.v+=(targetV-c.v)*Math.min(1,dt*(targetV<c.v?5:1.7));c.x+=c.dx*c.v*dt*190;c.y+=c.dy*c.v*dt*190}else{let near=nearestJ(c.x/W,c.y/H);if(near.d<.075){if(near.j.type==='signal'&&Math.floor(t/3+near.i)%2)targetV*=.2;if(near.j.type==='round')targetV*=.72}targetV*=1+(c.road.w-1)*.2;c.v+=(targetV-c.v)*Math.min(1,dt*2);let len=Math.hypot((c.road.b.x-c.road.a.x)*W,(c.road.b.y-c.road.a.y)*H);c.u+=c.v*dt*170/len;let a=c.rev?c.road.b:c.road.a,b=c.rev?c.road.a:c.road.b;c.x=W*(a.x+(b.x-a.x)*c.u);c.y=H*(a.y+(b.y-a.y)*c.u)}
