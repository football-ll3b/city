<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#102a32"><title>فك الزحمة | مختبر المحرك V0.4</title>
<style>
:root{--p:#102a32;--m:#9ce9c7;--t:#f5faf9;--u:#abc0c1;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#b6d1ad;color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}button{font:inherit;border:0;color:inherit;touch-action:manipulation}canvas{position:absolute;inset:0;width:100%;height:100%}.top{position:absolute;top:calc(8px + var(--st));left:10px;right:10px;display:flex;justify-content:center;pointer-events:none}.hud{background:#102a32ee;border:1px solid #ffffff20;border-radius:17px;display:flex;min-width:min(720px,90%);box-shadow:0 7px 25px #173b3d25}.s{flex:1;padding:9px 13px;border-left:1px solid #ffffff18}.s:last-child{border:0}.s span{font-size:9px;color:var(--u)}.s b{display:block;font-size:19px;direction:ltr;text-align:right}.s small{font-size:8px;color:var(--m)}
.controls{position:absolute;bottom:calc(10px + var(--sb));left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:7px;border-radius:18px;background:#102a32ee}.sig,.btn{background:#27464d;border-radius:13px}.sig{min-width:120px;height:55px;font-weight:800;font-size:11px}.sig.on{background:var(--m);color:#102a32}.btn{width:52px;height:52px}.note{position:absolute;right:10px;top:calc(82px + var(--st));width:220px;background:#102a32e9;border-radius:15px;padding:12px}.note b{font-size:13px}.note p{font-size:10px;color:var(--u);line-height:1.6;margin:5px 0}.ok{color:var(--m)!important}
@media(max-width:650px){.hud{min-width:95%}.s{padding:7px}.s b{font-size:15px}.note{width:180px}.controls{left:6px;right:6px;transform:none;justify-content:center}.sig{min-width:102px}}
@media(max-height:550px) and (orientation:landscape){.top{top:calc(3px + var(--st))}.note{top:calc(62px + var(--st));padding:8px}.controls{bottom:calc(3px + var(--sb));padding:5px}.sig{height:45px}.btn{height:45px}}
</style></head><body>
<canvas id="c"></canvas>
<div class="top"><div class="hud"><div class="s"><span>عبرت</span><b id="score">0</b><small>سيارة</small></div><div class="s"><span>داخل المحاكاة</span><b id="cars">0</b><small>مركبة</small></div><div class="s"><span>الطابور</span><b id="queue">0</b><small>متوقفة</small></div><div class="s"><span>أقرب مسافة</span><b id="gap">--</b><small>بكسل</small></div></div></div>
<div class="note"><b>مختبر المحرك V0.4</b><p>هذه ليست خريطة المدينة. نختبر القيادة فقط: كل سيارة مربوطة بمسار، لا تقطع العشب، وتحافظ على مسافة من السيارة أمامها.</p><p class="ok" id="state">المحاكاة تعمل</p></div>
<div class="controls"><button class="sig on" id="ns">↕ شمال / جنوب<br><small>أخضر</small></button><button class="sig" id="ew">↔ شرق / غرب<br><small>أحمر</small></button><button class="btn" id="pause">Ⅱ</button><button class="btn" id="reset">↻</button></div>
<script>
'use strict';
const C=document.getElementById('c'),X=C.getContext('2d'),$=x=>document.getElementById(x);
let W=0,H=0,D=1,last=performance.now(),time=0,spawn=0,phase='NS',yellow=0,paused=false,cars=[],next=1,score=0;
const COLORS=['#ed7968','#e6bb61','#5cb6d1','#ece9dd','#70b291','#9e88c8','#ef985f'];
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;C.width=W*D;C.height=H*D;C.style.width=W+'px';C.style.height=H+'px';X.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
function geom(){let rw=Math.max(112,Math.min(170,Math.min(W,H)*.23)),cx=W*.5,cy=H*.53,lane=rw*.20,stop=rw*.62;return{rw,cx,cy,lane,stop}}
function lanePath(dir){let g=geom(),L=Math.max(W,H)+100,o=g.lane*.55;
 if(dir==='N')return [{x:g.cx-o,y:-45},{x:g.cx-o,y:H+45}];
 if(dir==='S')return [{x:g.cx+o,y:H+45},{x:g.cx+o,y:-45}];
 if(dir==='W')return [{x:-45,y:g.cy+o},{x:W+45,y:g.cy+o}];
 return [{x:W+45,y:g.cy-o},{x:-45,y:g.cy-o}]
}
function point(path,s){let a=path[0],b=path[1];return{x:a.x+(b.x-a.x)*s,y:a.y+(b.y-a.y)*s,ang:Math.atan2(b.y-a.y,b.x-a.x)}}
function stopS(dir){let g=geom(),p=lanePath(dir),target;if(dir==='N')target={x:g.cx-g.lane*.55,y:g.cy-g.stop};else if(dir==='S')target={x:g.cx+g.lane*.55,y:g.cy+g.stop};else if(dir==='W')target={x:g.cx-g.stop,y:g.cy+g.lane*.55};else target={x:g.cx+g.stop,y:g.cy-g.lane*.55};let a=p[0],b=p[1],dx=b.x-a.x,dy=b.y-a.y;return((target.x-a.x)*dx+(target.y-a.y)*dy)/(dx*dx+dy*dy)}
function spawnCar(seed=false){let ds=['N','S','E','W'],d=ds[Math.floor(Math.random()*4)],same=cars.filter(c=>c.dir===d);if(same.length>10)return;let p=lanePath(d),len=Math.hypot(p[1].x-p[0].x,p[1].y-p[0].y),s=seed?Math.random()*.34:0;if(same.some(c=>c.s<.08&&!seed))return;cars.push({id:next++,dir:d,axis:(d==='N'||d==='S')?'NS':'EW',path:p,s,v:seed?.18:0,max:.115+Math.random()*.018,color:COLORS[next%COLORS.length],wait:0,len})}
function front(c){let best=null,ds=9;for(const o of cars)if(o!==c&&o.dir===c.dir&&o.s>c.s){let d=(o.s-c.s)*c.len;if(d<ds*100){ds=d;best=o}}return best?ds:999}
function isInside(c){let g=geom(),p=point(c.path,c.s);return Math.abs(p.x-g.cx)<g.stop*.95&&Math.abs(p.y-g.cy)<g.stop*.95}
function step(dt){time+=dt;spawn+=dt;yellow=Math.max(0,yellow-dt);while(spawn>.58){spawn-=.58;spawnCar(false)}
 // Cars are ordered front-to-back per lane so following is deterministic.
 for(const d of ['N','S','E','W']){let list=cars.filter(c=>c.dir===d).sort((a,b)=>b.s-a.s);for(const c of list){let gap=front(c),target=c.max,ss=stopS(c.dir),dist=(ss-c.s)*c.len,green=phase===c.axis&&yellow<=0,inside=isInside(c);
   if(!green&&!inside&&dist>0&&dist<170)target=Math.min(target,Math.max(0,(dist-16)/140*c.max));
   // hard safety envelope + smooth following
   if(gap<70)target=Math.min(target,Math.max(0,(gap-31)/75*c.max));
   if(gap<31)target=0;
   c.v+=(target-c.v)*Math.min(1,dt*(target<c.v?7.5:2.2));
   let old=c.s;c.s+=c.v*dt;
   // Never allow a car to penetrate the safety box of the car ahead.
   let f=front(c);if(f<28){c.s=old;c.v=0}
   if(c.v<.006&&!inside)c.wait+=dt;else c.wait=Math.max(0,c.wait-dt*.5);
 }}
 for(let i=cars.length-1;i>=0;i--)if(cars[i].s>1.02){cars.splice(i,1);score++}
 hud()
}
function setPhase(p){if(p===phase||yellow>0)return;phase=p;yellow=.8;sync()}
function sync(){$('ns').classList.toggle('on',phase==='NS');$('ew').classList.toggle('on',phase==='EW');$('ns').innerHTML='↕ شمال / جنوب<br><small>'+(phase==='NS'&&yellow<=0?'أخضر':'أحمر')+'</small>';$('ew').innerHTML='↔ شرق / غرب<br><small>'+(phase==='EW'&&yellow<=0?'أخضر':'أحمر')+'</small>'}
$('ns').onclick=()=>setPhase('NS');$('ew').onclick=()=>setPhase('EW');$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'▶':'Ⅱ'};$('reset').onclick=()=>reset();
function reset(){cars=[];next=1;score=0;spawn=0;phase='NS';yellow=0;for(let i=0;i<12;i++)spawnCar(true);sync();hud()}
function hud(){let q=cars.filter(c=>c.wait>.8).length,g=999;for(const c of cars)g=Math.min(g,front(c));$('score').textContent=score;$('cars').textContent=cars.length;$('queue').textContent=q;$('gap').textContent=g===999?'--':Math.round(g);$('state').textContent=(g<25?'تحذير: مسافة صغيرة':'المسارات والمسافة تعمل');$('state').style.color=g<25?'#ff806f':'var(--m)'}
function drawRoad(){let g=geom();X.fillStyle='#b6d1ad';X.fillRect(0,0,W,H);X.fillStyle='#d8c99f';X.fillRect(g.cx-g.rw/2-6,0,g.rw+12,H);X.fillRect(0,g.cy-g.rw/2-6,W,g.rw+12);X.fillStyle='#35464a';X.fillRect(g.cx-g.rw/2,0,g.rw,H);X.fillRect(0,g.cy-g.rw/2,W,g.rw);
 X.strokeStyle='#e9dfae';X.lineWidth=2;X.setLineDash([14,12]);X.beginPath();X.moveTo(g.cx,0);X.lineTo(g.cx,H);X.stroke();X.beginPath();X.moveTo(0,g.cy);X.lineTo(W,g.cy);X.stroke();X.setLineDash([]);
 // stop bars
 X.strokeStyle='#f5f0d5';X.lineWidth=5;for(const [x1,y1,x2,y2] of [[g.cx-g.rw/2,g.cy-g.stop,g.cx+g.rw/2,g.cy-g.stop],[g.cx-g.rw/2,g.cy+g.stop,g.cx+g.rw/2,g.cy+g.stop],[g.cx-g.stop,g.cy-g.rw/2,g.cx-g.stop,g.cy+g.rw/2],[g.cx+g.stop,g.cy-g.rw/2,g.cx+g.stop,g.cy+g.rw/2]]){X.beginPath();X.moveTo(x1,y1);X.lineTo(x2,y2);X.stroke()}
 for(const [x,y,ok] of [[g.cx-g.stop*.9,g.cy-g.stop*.9,phase==='NS'&&yellow<=0],[g.cx+g.stop*.9,g.cy+g.stop*.9,phase==='NS'&&yellow<=0],[g.cx+g.stop*.9,g.cy-g.stop*.9,phase==='EW'&&yellow<=0],[g.cx-g.stop*.9,g.cy+g.stop*.9,phase==='EW'&&yellow<=0]]){X.fillStyle=ok?'#72d58b':'#f07568';X.beginPath();X.arc(x,y,9,0,7);X.fill()}
}
function drawCar(c){let p=point(c.path,c.s),g=geom(),cw=Math.max(8,g.lane*.26),cl=cw*1.8;X.save();X.translate(p.x,p.y);X.rotate(p.ang);X.fillStyle='#17282c';X.fillRect(-cl/2-1,-cw/2-1,cl+2,cw+2);X.fillStyle=c.color;X.beginPath();if(X.roundRect)X.roundRect(-cl/2,-cw/2,cl,cw,Math.max(2,cw*.22));else X.rect(-cl/2,-cw/2,cl,cw);X.fill();X.fillStyle='#d7e8e9';X.fillRect(-cl*.08,-cw*.39,cl*.28,cw*.78);X.restore()}
function draw(){drawRoad();cars.forEach(drawCar)}
function frame(n){requestAnimationFrame(frame);let dt=Math.min(.05,(n-last)/1000);last=n;if(!paused)step(dt);draw();if(yellow>0)sync()}requestAnimationFrame(frame);reset();
</script></body></html>
