<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>حرب الجزر 3D — الخرائط V0.4</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071a2a;color:#fff;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}#view{position:absolute;inset:0;touch-action:none}#ui{position:absolute;top:12px;right:12px;left:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:none}#ui>*{pointer-events:auto}button,select{background:#143a53;color:white;border:1px solid #477c9a;border-radius:10px;padding:10px 13px;font-size:15px}button:active{background:#276184}#info{background:#071a2acb;padding:10px 14px;border-radius:10px;font-size:13px}#hint{position:absolute;bottom:12px;right:12px;left:12px;text-align:center;font-size:12px;background:#071a2ab8;padding:8px;border-radius:10px}#error{position:absolute;top:45%;width:100%;text-align:center;color:#ffdbb0;display:none}.tag{font-weight:700}</style></head><body><div id="view"></div><div id="ui"><select id="size"><option value="small">صغيرة (15–25 مدينة)</option><option value="medium" selected>متوسطة (30–45 مدينة)</option><option value="large">كبيرة (50–80 مدينة)</option></select><button id="generate">خريطة جديدة</button><button id="reset">إعادة الكاميرا</button><button id="export">تصدير بيانات الخريطة</button><div id="info">جارٍ التحميل...</div></div><div id="hint">اسحب بإصبع لتدوير الخريطة • إصبعان للتحريك والتقريب • اضغط مدينة لمعرفة تفاصيلها</div><div id="error">تعذر تحميل محرك 3D. افتح الملف مع اتصال بالإنترنت في Safari.</div><script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script><script>
(()=>{'use strict';if(!window.THREE){document.getElementById('error').style.display='block';return;}const T=THREE,view=document.getElementById('view'),info=document.getElementById('info');const scene=new T.Scene();scene.background=new T.Color(0x91d9ed);scene.fog=new T.FogExp2(0x91d9ed,.0008);const camera=new T.PerspectiveCamera(48,innerWidth/innerHeight,.1,1000),renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=T.SRGBColorSpace;view.appendChild(renderer.domElement);scene.add(new T.HemisphereLight(0xe7faff,0x4d6751,2.3));const sun=new T.DirectionalLight(0xffedc0,2.4);sun.position.set(-60,90,30);scene.add(sun);const ocean=new T.Mesh(new T.PlaneGeometry(1200,1200),new T.MeshStandardMaterial({color:0x177eaa,roughness:.38,metalness:.12}));ocean.rotation.x=-Math.PI/2;ocean.position.y=-1.2;scene.add(ocean);let group=new T.Group();scene.add(group);let mapData=null,labels=[],pickable=[];const COLORS=[0x287bff,0xe64b4b,0x8f5ae6,0x36b76b,0xe6ac37,0xd4dce5];let seed=1;function rand(){seed=(Math.imul(1664525,seed)+1013904223)>>>0;return seed/4294967296}function between(a,b){return a+(b-a)*rand()}function mat(c){return new T.MeshStandardMaterial({color:c,roughness:.86,flatShading:true})}const wallMat=mat(0xece2cb),roofMat=mat(0x7a5651),neutralMat=mat(0x8995a1);function mesh(geo,material,x,y,z,parent=group){let m=new T.Mesh(geo,material);m.position.set(x,y,z);parent.add(m);return m}function box(w,h,d,material,x,y,z,parent){return mesh(new T.BoxGeometry(w,h,d),material,x,y,z,parent)}function island(cx,cz,rx,rz,biome){
 const colors={tropical:[0x477d55,0x91c779],desert:[0xb79b66,0xf1d18a],snow:[0x91b3bc,0xe6f2f2]}[biome];
 // One solid extruded shoreline, no overlapping raised caps or white patches.
 const N=32, shape=new T.Shape();let pts=[];
 for(let i=0;i<N;i++){let a=i/N*Math.PI*2,r=1+.025*Math.sin(i*2.6+cx*.15)+.018*Math.cos(i*4.1+cz*.11);pts.push([Math.cos(a)*rx*r,Math.sin(a)*rz*r]);}
 shape.moveTo(...pts[0]);for(let i=1;i<N;i++)shape.lineTo(...pts[i]);shape.closePath();
 let geo=new T.ExtrudeGeometry(shape,{depth:1.35,bevelEnabled:false,steps:1,curveSegments:2});geo.rotateX(Math.PI/2);
 let land=mesh(geo,[mat(colors[1]),mat(colors[0])],cx,1.55,cz);land.userData.biome=biome;
 for(let k=0;k<Math.min(7,Math.floor(rx*rz/75));k++){
 let a=between(0,Math.PI*2),r=Math.sqrt(rand())*.72,x=cx+Math.cos(a)*rx*r,z=cz+Math.sin(a)*rz*r;
 if(biome==='tropical'){mesh(new T.CylinderGeometry(.13,.19,1.25,5),mat(0x765338),x,2.35,z);mesh(new T.ConeGeometry(.7,1.65,6),mat(0x287b4c),x,3.55,z)}
 else if(biome==='snow'){mesh(new T.ConeGeometry(.7,1.6,6),mat(0x416c65),x,2.8,z);mesh(new T.ConeGeometry(.43,.72,6),mat(0xf5fbfc),x,3.65,z)}
 else {mesh(new T.CylinderGeometry(.12,.16,1.2,5),mat(0x4a9a61),x,2.35,z)}
 }
}
function city(c){
 const color=c.owner===null?0x929da6:COLORS[c.owner];
 const base=mesh(new T.CylinderGeometry(1.55,1.75,.6,8),mat(color),c.x,2.2,c.z);base.userData.city=c;pickable.push(base);
 const tower=mesh(new T.CylinderGeometry(.85,1,1.9,6),wallMat,c.x,3.45,c.z);tower.userData.city=c;pickable.push(tower);
 const roof=mesh(new T.ConeGeometry(1.15,1.15,6),mat(color),c.x,4.95,c.z);roof.userData.city=c;pickable.push(roof);
 // Labels are compact and hidden when zoomed out. Colored roof remains visible.
 const canvas=document.createElement('canvas');canvas.width=256;canvas.height=96;const ctx=canvas.getContext('2d');
 ctx.fillStyle='#08283de8';ctx.beginPath();ctx.roundRect(8,8,240,80,15);ctx.fill();ctx.strokeStyle=c.owner===null?'#cbd5e1':'#ffffff';ctx.lineWidth=3;ctx.stroke();
 ctx.fillStyle='#fff';ctx.font='bold 34px system-ui';ctx.textAlign='center';ctx.fillText((c.owner===null?'○ ':'● ')+c.id+'  Lv'+c.level,128,62);
 const sprite=new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(canvas),depthTest:false,transparent:true}));sprite.position.set(c.x,7,c.z);sprite.scale.set(4.7,1.76,1);group.add(sprite);labels.push(sprite);
}
function generate(){
 seed=(Date.now()>>>0)||1234;
 const size=document.getElementById('size').value;
 const cfg={small:[15,25,6,29],medium:[30,45,8,40],large:[50,80,12,55]}[size];
 const count=Math.floor(between(cfg[0],cfg[1]+1)),n=cfg[2],radius=cfg[3];

  const angle=2*Math.PI*i/n+between(-.055,.055);
  const ring=radius*(size==='large'?1.38:1.20);
  islands.push({x:Math.cos(angle)*ring,z:Math.sin(angle)*ring*.85,rx:12,rz:12,

 }
 const quotas=Array(n).fill(Math.floor(count/n));for(let i=0;i<count%n;i++)quotas[i]++;
 const cities=[];
 for(let i=0;i<n;i++){
  const q=quotas[i],isl=islands[i],spacing=8.6;
  // A compact hex lattice: no cities outside the island's interior ellipse.
  const slots=[];
  for(let row=-7;row<=7;row++)for(let col=-7;col<=7;col++){
   let x=(col+(Math.abs(row)%2)*.5)*spacing,z=row*spacing*.866;
   slots.push({x,z,r:x*x+z*z});
  }
  slots.sort((a,b)=>a.r-b.r);
  const picked=slots.slice(0,q);
  const maxX=Math.max(...picked.map(v=>Math.abs(v.x))),maxZ=Math.max(...picked.map(v=>Math.abs(v.z)));
  isl.rx=Math.max(13,maxX+7);isl.rz=Math.max(13,maxZ+7);
  for(const pos of picked)cities.push({id:cities.length+1,x:0,z:0,ox:pos.x,oz:pos.z,island:i,owner:null,level:1,strength:['weak','medium','strong'][Math.floor(rand()*3)]});
 }
 // Collision-free islands, checked as ellipses in X/Z with a shoreline margin.
 for(let iteration=0;iteration<250;iteration++){
  let movedAny=false;
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){
   let a=islands[i],b=islands[j],dx=b.x-a.x,dz=b.z-a.z;
   let rx=a.rx+b.rx+2.5,rz=a.rz+b.rz+2.5;
   let metric=Math.hypot(dx/rx,dz/rz);
   if(metric<1){
    if(metric<.00001){dx=.01;dz=.01;metric=.0001;}
    let amount=(1-metric)*.54;
    a.x-=dx*amount;a.z-=dz*amount;b.x+=dx*amount;b.z+=dz*amount;movedAny=true;
   }
  }
  if(!movedAny)break;
 }
 for(const c of cities){const isl=islands[c.island];c.x=+(isl.x+c.ox).toFixed(2);c.z=+(isl.z+c.oz).toFixed(2);delete c.ox;delete c.oz;}
 islands.forEach(i=>island(i.x,i.z,i.rx,i.rz,i.biome));
 const chosen=[],used=new Set();while(chosen.length<6){let best=-1,score=-1;for(let i=0;i<cities.length;i++){let c=cities[i];if(used.has(c.island))continue;let d=chosen.length?Math.min(...chosen.map(j=>Math.hypot(c.x-cities[j].x,c.z-cities[j].z))):Math.hypot(c.x,c.z);if(d>score){score=d;best=i}}if(best<0)break;chosen.push(best);used.add(cities[best].island)}
 chosen.forEach((i,player)=>{cities[i].owner=player;cities[i].strength='starting'});cities.forEach(city);
 mapData={format:'harb-aljuzur-map-v4',seed,size,cityCount:cities.length,islands,cities,playerCount:6,startingCityIds:chosen.map(i=>cities[i].id),rules:{neutralProduction:false,neutralStrengths:['weak','medium','strong'],startingCitiesPerPlayer:1}};
 info.textContent=`${cities.length} مدينة • ${islands.length} جزر • 6 مواقع بداية`;
 resetCamera();
}
let target=new T.Vector3(),yaw=.65,pitch=.95,dist=175;function resetCamera(){yaw=.65;pitch=.95;{let bounds=mapData.islands.reduce((b,i)=>({minX:Math.min(b.minX,i.x-i.rx),maxX:Math.max(b.maxX,i.x+i.rx),minZ:Math.min(b.minZ,i.z-i.rz),maxZ:Math.max(b.maxZ,i.z+i.rz)}),{minX:Infinity,maxX:-Infinity,minZ:Infinity,maxZ:-Infinity});target.set((bounds.minX+bounds.maxX)/2,0,(bounds.minZ+bounds.maxZ)/2);const width=bounds.maxX-bounds.minX,depth=bounds.maxZ-bounds.minZ;const aspect=innerWidth/innerHeight;dist=Math.max(width/(2*Math.tan(camera.fov*Math.PI/360)*aspect),depth/(2*Math.tan(camera.fov*Math.PI/360)))*1.30+15;}updateCamera()}function updateCamera(){pitch=Math.max(.2,Math.min(1.48,pitch));dist=Math.max(20,Math.min(450,dist));camera.position.set(target.x+dist*Math.sin(pitch)*Math.cos(yaw),target.y+dist*Math.cos(pitch),target.z+dist*Math.sin(pitch)*Math.sin(yaw));camera.lookAt(target)}const pointers=new Map();let lastPinch=0,lastMid=null,moved=false;renderer.domElement.addEventListener('pointerdown',e=>{renderer.domElement.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false});renderer.domElement.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const old=pointers.get(e.pointerId);let dx=e.clientX-old.x,dy=e.clientY-old.y;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(Math.abs(dx)+Math.abs(dy)>2)moved=true;if(pointers.size===1){yaw-=dx*.007;pitch-=dy*.006}else if(pointers.size===2){let ps=[...pointers.values()],d=Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y),mid={x:(ps[0].x+ps[1].x)/2,y:(ps[0].y+ps[1].y)/2};if(lastPinch)dist*=lastPinch/d;if(lastMid){let right=new T.Vector3().setFromMatrixColumn(camera.matrix,0);let forward=new T.Vector3();camera.getWorldDirection(forward);forward.y=0;forward.normalize();target.addScaledVector(right,-(mid.x-lastMid.x)*dist/750);target.addScaledVector(forward,(mid.y-lastMid.y)*dist/750)}lastPinch=d;lastMid=mid}updateCamera()});renderer.domElement.addEventListener('pointerup',e=>{if(!moved&&pointers.size===1){let p=new T.Vector2(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1),ray=new T.Raycaster();ray.setFromCamera(p,camera);let hit=ray.intersectObjects(pickable)[0];if(hit){let c=hit.object.userData.city;info.textContent=`مدينة ${c.id} • ${c.owner===null?'محايدة / '+({weak:'ضعيفة',medium:'متوسطة',strong:'قوية'}[c.strength]):c.owner===0?'مدينتك':'كمبيوتر '+c.owner} • المستوى ${c.level}`}}pointers.delete(e.pointerId);lastPinch=0;lastMid=null});renderer.domElement.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);lastPinch=0;lastMid=null});renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();dist*=Math.exp(e.deltaY*.001);updateCamera()},{passive:false});document.getElementById('generate').onclick=generate;document.getElementById('size').onchange=generate;document.getElementById('reset').onclick=resetCamera;document.getElementById('export').onclick=()=>{if(!mapData)return;let blob=new Blob([JSON.stringify(mapData,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='harb-aljuzur-'+mapData.size+'-'+mapData.seed+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);if(mapData)resetCamera()});generate();(function animate(){requestAnimationFrame(animate);labels.forEach(l=>{l.visible=dist<95});renderer.render(scene,camera)})()})();
</script></body></html>
