<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>من القاتل؟ — مسرح التحقيق</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#070e23;color:#f6f4ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 80% 5%,#39205d 0,transparent 45%),radial-gradient(ellipse at 10% 90%,#0d4b6d 0,transparent 42%),#080d22}header{padding:18px 22px;border-bottom:1px solid #784cb6;background:#0a112bdc;display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:clamp(24px,4vw,40px);color:#ffdf8b;margin:0;text-shadow:0 0 20px #ed9b52}h2{font-size:24px;margin:0 0 15px}h3{margin:0 0 8px;color:#f9dc95}small,.muted{color:#aebad7}main{max-width:1320px;margin:auto;padding:22px}.panel{background:linear-gradient(145deg,#131d40ee,#15102fe9);border:1px solid #6d5ea4;border-radius:22px;padding:22px;margin-bottom:18px;box-shadow:0 12px 38px #0005}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:15px}.item{background:#101d3a;border:1px solid #346ca4;border-radius:16px;padding:17px}.item b{color:#ffd780}.item p{line-height:1.7;margin:7px 0}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.btn,button{border:1px solid #5bafff;border-radius:13px;padding:12px 19px;background:linear-gradient(#2764b1,#112657);color:white;font-size:16px;font-weight:700;cursor:pointer}.btn.gold{background:linear-gradient(#f7c85f,#a66a18);border-color:#ffde9c;color:#171328}.btn.purple{background:linear-gradient(#9139c4,#4b1d8b);border-color:#f37bff}button:disabled{opacity:.45;cursor:default}input,select{padding:12px;border-radius:12px;border:1px solid #6382b4;background:#08142e;color:white;font-size:17px;max-width:100%;width:100%}label{display:block;margin:10px 0 5px;color:#c9d9f5}.wide{width:100%}.tag{border:1px solid #697ba9;background:#101b3c;padding:7px 12px;border-radius:30px;display:inline-block;margin:3px;font-size:14px}.hint{padding:15px;border:1px solid #bb6fdb;border-radius:14px;background:#251344;margin:9px 0}.score{font-size:36px;color:#ffcf67;font-weight:800}.notice{padding:12px;border-radius:12px;background:#223453;color:#cce8ff}.error{color:#ff9999;min-height:24px}.timer{font-size:42px;color:#ffcf76;font-variant-numeric:tabular-nums;font-weight:800}.choice{padding:11px 15px;border:1px solid #506ba0;border-radius:12px;margin:7px 0;display:block;cursor:pointer}.choice:has(input:checked){background:#244e8d;border-color:#69dcff}.choice input{width:auto;margin-left:10px}footer{text-align:center;color:#8096b8;padding:25px}.hidden{display:none} .headline{font-size:clamp(20px,3vw,33px);font-weight:800;color:#ffdf92}@media(max-width:650px){main{padding:10px}.panel{padding:16px}header{padding:12px}h1{font-size:25px}}
</style></head><body><header><h1>🔎 من القاتل؟</h1><span class="tag">مسرح التحقيق • 5 جولات</span></header><main id="app"></main><footer>نسخة تجريبية مستقلة — لا تعدّل جرس التحديات</footer><script>
const app=document.querySelector('#app'), query=new URLSearchParams(location.search);let code=query.get('room')||sessionStorage.getItem('room'),token=sessionStorage.getItem('token'),state=null,notice='';const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const e=escapeHtml;
async function api(path,data={}){const res=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,token,...data})});const d=await res.json();if(!res.ok)throw Error(d.error||'خطأ');return d}
async function action(path,data={}){try{const d=await api(path,data);if(d.token){token=d.token;code=d.code;sessionStorage.setItem('token',token);sessionStorage.setItem('room',code);history.replaceState({},'', '?room='+code)}notice='';await poll()}catch(ex){notice=ex.message;render()}}
async function poll(){if(!code||!token)return render();try{const r=await fetch('/api/state?code='+encodeURIComponent(code)+'&token='+encodeURIComponent(token),{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error);state=d;render()}catch(ex){notice=ex.message;render()}}
function btn(text,call,cls=''){return `<button class="${cls}" onclick="${call}">${text}</button>`}
function opts(arr,name){return arr.map((v,i)=>`<label class="choice"><input type="radio" name="${name}" value="${i}">${e(v)}</label>`).join('')}
function choose(name,arr){return `<select id="${name}"><option value="">اختر...</option>${arr.map((x,i)=>`<option value="${i}">${e(x)}</option>`).join('')}</select>`}
function selection(name,arr){let el=document.querySelector('#'+name);return arr[Number(el.value)]}
function roster(s){return `<div class="grid">${s.players.map(p=>`<div class="item"><h3>${e(p.name)} ${p.id===s.doctor_id?'🩺':''}</h3><div class="muted">${p.connected?'● متصل':'○ غير متصل'}</div><div class="score">${p.score}</div><b>الأدوات</b><p>${(p.weapons||[]).map(e).join(' · ')||'بانتظار القرعة'}</p><b>الأدلة</b><p>${(p.evidence||[]).map(e).join(' · ')||'بانتظار القرعة'}</p></div>`).join('')}</div>`}
function render(){if(!state){app.innerHTML=`<section class="panel"><h2>مرحباً بك في مسرح التحقيق</h2><p>الآيباد يدير المباراة، وكل لاعب يدخل من هاتفه إلى نفس الغرفة.</p><div class="grid"><div class="item"><h3>🎛️ الآيباد — مقدّم المباراة</h3>${btn('إنشاء غرفة جديدة','action("create")','gold wide')}</div><div class="item"><h3>📱 الانضمام</h3><label>رمز الغرفة</label><input id="joinCode" value="${e(code||'')}" placeholder="ABCDE"><label>اسم اللاعب</label><input id="joinName" maxlength="24" placeholder="اسمك">${btn('دخول الغرفة','join()','wide')}</div></div><p class="error">${e(notice)}</p></section>`;return}
const s=state,host=!!s.is_host,me=s.you,role=me?.role;let html=`<div class="panel"><div class="row"><span class="headline">الغرفة ${e(s.code)}</span><span class="tag">الجولة ${s.round} / 5</span><span class="tag">${e({lobby:'الانتظار',killer:'اختيار القاتل',doctor:'الطبيب الشرعي',investigate:'التحقيق',results:'النتائج',finished:'النهاية'}[s.phase])}</span>${s.time_left!=null?`<span class="timer">${Math.floor(s.time_left/60)}:${String(s.time_left%60).padStart(2,'0')}</span>`:''}</div>${host?`<p>رابط الدخول: <a style="color:#8bdcff" href="${location.origin}/?room=${s.code}">${location.origin}/?room=${s.code}</a></p><div id="qr" class="notice">افتح الرابط من هواتف اللاعبين. <img style="width:190px;background:white;padding:8px;border-radius:12px" alt="رمز QR لدخول الغرفة" src="/api/qr?url=${encodeURIComponent(location.origin+'/?room='+s.code)}"><p>امسح الرمز بكاميرا الهاتف للانضمام.</p></div>`:`<p>أهلاً ${e(me.name)} · دورك: <b>${e({waiting:'بانتظار البداية',killer:'القاتل',doctor:'الطبيب الشرعي',investigator:'محقق'}[role])}</b></p>`}</div>`;
if(s.phase==='lobby'){
 if(host)html+=`<section class="panel"><h2>إعدادات المباراة</h2><label>طريقة اختيار الطبيب الشرعي</label><select id="mode" onchange="setDoctor()"><option value="random" ${s.doctor_mode==='random'?'selected':''}>عشوائي</option><option value="manual" ${s.doctor_mode==='manual'?'selected':''}>يدوي</option></select><label>الطبيب عند الاختيار اليدوي</label><select id="manual" onchange="setDoctor()"><option value="">اختر لاعباً</option>${s.players.map(p=>`<option value="${p.id}" ${s.doctor_manual===p.id?'selected':''}>${e(p.name)}</option>`).join('')}</select><p class="muted">عند تعارض الطبيب المختار مع القاتل، يُختار طبيب آخر عشوائياً.</p>${btn('ابدأ المباراة (4–10 لاعبين)','action("start")','gold')}</section>`;
 else html+=`<section class="panel"><h2>انتظر بداية المباراة</h2><p>بعد انضمام الجميع، يبدأ المقدّم القرعة.</p></section>`;
}else if(s.phase==='killer'){
 html+=`<section class="panel"><h2>🔒 اختيار أداة الجريمة والدليل</h2>${role==='killer'?`<p>أنت القاتل. اختر أداة ودليلاً من بطاقاتك، ولا تُظهر هاتفك لأحد.</p><label>الأداة</label>${choose('weapon',me.weapons)}<label>الدليل</label>${choose('evidence',me.evidence)}${btn('تأكيد الاختيار السري','sendChoice()','gold wide')}`:'<p>القاتل يختار الأداة والدليل سراً. انتظر بدء تقرير الطبيب.</p>'}</section>`;
}else if(s.phase==='doctor'){
 html+=`<section class="panel"><h2>🩺 إعداد التقرير الشرعي</h2>${role==='doctor'?`<div class="notice">الأداة: ${e(me.choice?.weapon)} · الدليل: ${e(me.choice?.evidence)}. اختر أي إجابة بحرية؛ لا يوجد فحص لصحتها.</div><h3>${e(s.question?.question)}</h3>${opts(s.question?.options||[],'answer')}${btn('اعتماد الإجابة','sendHint()','gold')}<p>التقرير ${s.hint_count+1} من 5</p>`:'<p>الطبيب يختار خمس إجابات سرية، ثم يبدأ التحقيق لمدة 4 دقائق.</p>'}</section>`;
}else if(s.phase==='investigate'){
 html+=`<section class="panel"><h2>🧩 تقارير الطبيب الشرعي</h2><p class="muted">يظهر تقرير جديد كل 40 ثانية. يمكنكم النقاش وإرسال التصويت في أي وقت.</p>${s.hints.length?s.hints.map((h,i)=>`<div class="hint"><b>التقرير ${i+1}: ${e(h.question)}</b><p>${e(h.answer)}</p></div>`).join(''):'<p>بانتظار أول تقرير...</p>'}</section>`;
 if(role==='investigator'||role==='killer')html+=`<section class="panel"><h2>🗳️ التصويت السري</h2>${me.submitted?'<p class="notice">تم تسجيل إجابتك ولا يمكن تعديلها.</p>':`<label>من القاتل؟</label><select id="suspect"><option value="">اختر...</option>${s.players.filter(p=>p.id!==me.id).map(p=>`<option value="${p.id}">${e(p.name)}</option>`).join('')}</select><label>الأداة</label>${choose('weapon',s.players.flatMap(p=>p.weapons))}<label>الدليل</label>${choose('evidence',s.players.flatMap(p=>p.evidence))}${btn('تأكيد التصويت','sendVote()','gold wide')}`}<p class="muted">${s.votes_count} تصويت مُرسل</p></section>`;
 if(host)html+=`<section class="panel">${btn('إغلاق التصويت وإظهار النتائج','action("finish")','purple')}</section>`;
}else if(s.phase==='results'){
 const r=s.results,k=s.players.find(p=>p.id===r.killer);html+=`<section class="panel"><h2>🏆 كشف الحقيقة</h2><div class="grid"><div class="item"><h3>القاتل</h3><div class="score">${e(k?.name)}</div></div><div class="item"><h3>الأداة</h3><div class="headline">${e(r.choice.weapon)}</div></div><div class="item"><h3>الدليل</h3><div class="headline">${e(r.choice.evidence)}</div></div></div><p>كشفه ${r.correct_k} من ${r.investigators} محققين · ${r.majority?'انكشف بالأغلبية':'نجا من الأغلبية'}</p><h3>نقاط هذه الجولة</h3>${s.players.map(p=>`<p>${e(p.name)}: +${r.awarded[p.id]} نقطة</p>`).join('')}<h3>أصوات المحققين</h3>${Object.entries(r.votes).map(([id,v])=>{let p=s.players.find(x=>x.id===id),x=s.players.find(x=>x.id===v.killer);return `<p>${e(p?.name)} ← ${e(x?.name)} · ${e(v.weapon)} · ${e(v.evidence)}</p>`}).join('')}${host?`<h3>الطبيب الشرعي للجولة التالية</h3><select id="mode" onchange="setDoctor()"><option value="random" ${s.doctor_mode==='random'?'selected':''}>عشوائي</option><option value="manual" ${s.doctor_mode==='manual'?'selected':''}>يدوي</option></select><select id="manual" onchange="setDoctor()"><option value="">اختر الطبيب</option>${s.players.map(p=>`<option value="${p.id}" ${s.doctor_manual===p.id?'selected':''}>${e(p.name)}</option>`).join('')}</select>${btn('الجولة التالية','action("start")','gold')}`:''}</section>`;
}else if(s.phase==='finished')html+=`<section class="panel"><h2>🏆 النتائج النهائية</h2>${[...s.players].sort((a,b)=>b.score-a.score).map((p,i)=>`<div class="item"><b>${i+1}. ${e(p.name)}</b> <span class="score">${p.score}</span></div>`).join('')}</section>`;
if(s.phase!=='finished')html+=`<section class="panel"><h2>👥 لوحة اللاعبين والأدلة</h2>${roster(s)}</section>`;
app.innerHTML=html+`<p class="error">${e(notice)}</p>`;
}
async function join(){const c=document.querySelector('#joinCode').value.trim().toUpperCase(),name=document.querySelector('#joinName').value.trim();code=c;await action('join',{name})}
async function setDoctor(){await action('settings',{mode:document.querySelector('#mode').value,doctor:document.querySelector('#manual').value})}
async function sendChoice(){const w=selection('weapon',state.you.weapons),v=selection('evidence',state.you.evidence);await action('choice',{weapon:w,evidence:v})}
async function sendHint(){const input=document.querySelector('input[name="answer"]:checked');if(!input)return alert('اختر إجابة');await action('hint',{answer:state.question.options[Number(input.value)]})}
async function sendVote(){const k=document.querySelector('#suspect').value,w=selection('weapon',state.players.flatMap(p=>p.weapons)),v=selection('evidence',state.players.flatMap(p=>p.evidence));if(!k||!w||!v)return alert('اختر العناصر الثلاثة');await action('vote',{killer:k,weapon:w,evidence:v})}
const oldAction=action;action=async function(path,data={}){if(path==='create'){try{const d=await api('create');token=d.token;code=d.code;sessionStorage.setItem('token',token);sessionStorage.setItem('room',code);history.replaceState({},'', '?room='+code);await poll()}catch(ex){notice=ex.message;render()}}else await oldAction(path,data)};
setInterval(poll,1500);poll();
</script></body></html>
