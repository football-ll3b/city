<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#102a32"><title>فك الزحمة | عجمان V0.6</title>
<style>
:root{--p:#102a32;--m:#9ce9c7;--t:#f5faf9;--u:#abc0c1;--red:#ff7467;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#b6d1ad;color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}button{font:inherit;border:0;color:inherit;touch-action:manipulation}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.top{position:absolute;top:calc(7px + var(--st));left:8px;right:8px;display:flex;justify-content:center;pointer-events:none}.hud,.panel,.controls{background:#102a32ee;border:1px solid #ffffff20;box-shadow:0 7px 25px #173b3d25}.hud{border-radius:17px;display:flex;min-width:min(780px,94%)}.s{flex:1;padding:8px 12px;border-left:1px solid #ffffff18}.s:last-child{border:0}.s span{font-size:9px;color:var(--u)}.s b{display:block;font-size:18px;direction:ltr;text-align:right}.s small{font-size:8px;color:var(--m)}
.panel{position:absolute;right:9px;top:calc(80px + var(--st));width:220px;border-radius:15px;padding:10px}.panel b{font-size:13px}.panel p{font-size:10px;color:var(--u);line-height:1.5;margin:5px 0}.progress{height:5px;background:#29464c;border-radius:8px;overflow:hidden}.progress i{display:block;height:100%;background:var(--m)}
.controls{position:absolute;bottom:calc(8px + var(--sb));left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:7px;border-radius:18px}.pick,.switch,.btn{background:#27464d;border-radius:13px}.pick{min-width:92px;height:50px}.pick.on,.switch{background:var(--m);color:#102a32}.switch{min-width:165px;height:50px;font-weight:800}.btn{width:48px;height:48px}.locked{opacity:.35}.hint{position:absolute;bottom:calc(72px + var(--sb));left:50%;transform:translateX(-50%);background:#102a32e9;border-radius:11px;padding:7px 11px;font-size:10px;white-space:nowrap}.toast{position:absolute;top:calc(145px + var(--st));left:50%;transform:translateX(-50%);background:#102a32;padding:10px 15px;border-radius:12px;font-size:11px;opacity:0;transition:.2s}.toast.show{opacity:1}
@media(max-width:650px){.s{padding:6px}.s b{font-size:14px}.panel{width:180px}.controls{left:5px;right:5px;transform:none;justify-content:center}.switch{min-width:145px}.hint{max-width:90%;white-space:normal;text-align:center}}
@media(max-height:550px) and (orientation:landscape){.top{top:calc(3px + var(--st))}.panel{top:calc(60px + var(--st));padding:7px;width:180px}.controls{bottom:calc(3px + var(--sb));padding:5px}.pick,.switch{height:43px}.btn{height:43px}.hint{bottom:calc(59px + var(--sb))}}
</style></head><body>
<canvas id="c"></canvas>
<div class="top"><div class="hud"><div class="s"><span>المدينة</span><b>عجمان</b><small>الحملة 🇦🇪</small></div><div class="s"><span>عبرت</span><b id="score">0</b><small>سيارة</small></div><div class="s"><span>المرحلة</span><b id="stage">1</b><small id="unlock">مستقيم فقط</small></div><div class="s"><span>الطابور</span><b id="queue">0</b><small id="qstate">مستقر</small></div><div class="s"><span>التالي</span><b id="next">100</b><small>سيارة</small></div></div></div>
<div class="panel"><b>تحدّي عجمان V0.6</b><p id="desc"></p><div class="progress"><i id="prog"></i></div><p id="danger">اسحب الخريطة بإصبع. كبّر/صغّر بإصبعين.</p></div>
<div class="hint">اختر التقاطع ثم اضغط «بدّل الأخضر». التحكم صار بزر واحد لكل تقاطع.</div>
<div class="controls"><button class="pick on" id="pick1">تقاطع 1<br><small>محدد</small></button><button class="pick locked" id="pick2" disabled>تقاطع 2<br><small>مغلق</small></button><button class="switch" id="switch">↕ أخضر<br><small>بدّل الاتجاه</small></button><button class="btn" id="pause">Ⅱ</button><button class="btn" id="home">⌂</button><button class="btn" id="reset">↻</button></div><div class="toast" id="toast"></div>
<script>
'use strict';const C=document.getElementById('c'),X=C.getContext('2d'),$=x=>document.getElementById(x);
let W,H,D=1,last=performance.now(),score=0,stage=1,lanes=1,spawn=0,cars=[],nid=1,phase=['NS','NS'],yellow=[0,0],selected=0,paused=false,lost=false,dangerT=0;
let cam={x:0,y:0,z:1},ptr=new Map(),gesture=null;
const COLORS=['#ed7968','#e6bb61','#5cb6d1','#ece9dd','#70b291','#9e88c8','#ef985f'];
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;C.width=W*D;C.height=H*D;X.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
function G(){let rw=170,cy=520,cx=[360,980];return{rw,cy,cx,stop:105,lw:rw/(lanes*2+1),worldW:1340,worldH:1040}}
function toScreen(p){return{x:(p.x-cam.x)*cam.z+W/2,y:(p.y-cam.y)*cam.z+H/2}}function resetCam(){let g=G();cam.z=Math.min(W/g.worldW,H/g.worldH)*1.12;cam.x=g.worldW/2;cam.y=g.worldH/2}
function pathLine(dir,lane){let g=G(),j=+dir[1]-1,cx=g.cx[j],d=dir[0],sign=(d==='N'||d==='E')?-1:1,off=sign*(lane+.5)*g.lw;if(d==='N')return[{x:cx+off,y:-80},{x:cx+off,y:g.worldH+80}];if(d==='S')return[{x:cx+off,y:g.worldH+80},{x:cx+off,y:-80}];if(d==='W')return[{x:-80,y:g.cy-off},{x:g.worldW+80,y:g.cy-off}];return[{x:g.worldW+80,y:g.cy-off},{x:-80,y:g.cy-off}]}
function lerp(a,b,t){return{x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t}}function pointPath(c){let p=c.path;if(p.length===2){let q=lerp(p[0],p[1],c.s);return{...q,ang:Math.atan2(p[1].y-p[0].y,p[1].x-p[0].x)}}let seg=Math.min(p.length-2,Math.floor(c.s*(p.length-1))),u=c.s*(p.length-1)-seg,q=lerp(p[seg],p[seg+1],u);return{...q,ang:Math.atan2(p[seg+1].y-p[seg].y,p[seg+1].x-p[seg].x)}}
function movement(){if(stage===1)return'straight';let r=Math.random();if(stage===2)return r<.28?'right':'straight';return r<.22?'left':r<.48?'right':'straight'}
function turnPath(dir,lane,mv){let g=G(),j=+dir[1]-1,cx=g.cx[j],cy=g.cy,base=pathLine(dir,lane);if(mv==='straight')return base;let d=dir[0],right=mv==='right',exitDir;
 const mapR={N:'W',S:'E',W:'S',E:'N'},mapL={N:'E',S:'W',W:'N',E:'S'};exitDir=(right?mapR:mapL)[d]+(j+1);let out=pathLine(exitDir,Math.min(lane,lanes-1));
 let startS=.39,endS=.61,a=lerp(base[0],base[1],startS),b=lerp(out[0],out[1],.61),pts=[base[0],a];for(let k=1;k<=8;k++){let u=k/8,control={x:cx,y:cy},q={x:(1-u)*(1-u)*a.x+2*(1-u)*u*control.x+u*u*b.x,y:(1-u)*(1-u)*a.y+2*(1-u)*u*control.y+u*u*b.y};pts.push(q)}pts.push(out[1]);return pts}
function spawnCar(seed=false){let js=stage>=3?[1,2]:[1],j=js[Math.floor(Math.random()*js.length)],ds=['N','S','W','E'],d=ds[Math.floor(Math.random()*4)],lane=Math.floor(Math.random()*lanes),mv=movement();if(stage>=4){if(mv==='left')lane=0;if(mv==='right')lane=lanes-1}let dir=d+j,same=cars.filter(c=>c.dir===dir&&c.lane===lane);if(!seed&&same.some(c=>c.s<.07))return;let path=turnPath(dir,lane,mv),len=0;for(let k=1;k<path.length;k++)len+=Math.hypot(path[k].x-path[k-1].x,path[k].y-path[k-1].y);cars.push({id:nid++,dir,lane,mv,path,len,s:seed?Math.random()*.28:0,v:seed?.14:0,max:.09+Math.random()*.015,color:COLORS[nid%COLORS.length],wait:0,j:j-1})}
function stopS(c){return c.path.length===2?.39:.36}function inside(c){return c.s>.36&&c.s<.66}
function front(c){let gap=999;for(const o of cars)if(o!==c&&o.dir===c.dir&&o.lane===c.lane&&o.s>c.s)gap=Math.min(gap,(o.s-c.s)*c.len);return gap}
function green(c){if(yellow[c.j]>0)return false;let ax=(c.dir[0]==='N'||c.dir[0]==='S')?'NS':'EW';if(c.mv==='left'&&stage>=3){return phase[c.j]===ax&&!cars.some(o=>o.j===c.j&&o!==c&&o.mv==='straight'&&((o.dir[0]==='N'&&c.dir[0]==='S')||(o.dir[0]==='S'&&c.dir[0]==='N')||(o.dir[0]==='E'&&c.dir[0]==='W')||(o.dir[0]==='W'&&c.dir[0]==='E'))&&inside(o))}return phase[c.j]===ax}
function step(dt){if(lost)return;spawn+=dt;yellow[0]=Math.max(0,yellow[0]-dt);yellow[1]=Math.max(0,yellow[1]-dt);let interval=stage===1?.62:stage===2?.48:stage===3?.39:.33;while(spawn>interval){spawn-=interval;spawnCar(false)}
 for(const c of cars){let target=c.max,gap=front(c),dist=(stopS(c)-c.s)*c.len;if(!green(c)&&!inside(c)&&dist>0&&dist<170)target=Math.min(target,Math.max(0,(dist-15)/145*c.max));if(c.mv!=='straight'&&inside(c))target*=.68;if(gap<70)target=Math.min(target,Math.max(0,(gap-29)/80*c.max));if(gap<29)target=0;c.v+=(target-c.v)*Math.min(1,dt*(target<c.v?7:2));let old=c.s;c.s+=c.v*dt;if(front(c)<26){c.s=old;c.v=0}if(c.v<.005&&!inside(c))c.wait+=dt;else c.wait=Math.max(0,c.wait-dt*.45)}
 for(let i=cars.length-1;i>=0;i--)if(cars[i].s>1.01){cars.splice(i,1);score++;unlock()}
 let danger=cars.some(c=>c.wait>.8&&c.s<.12);dangerT=danger?dangerT+dt:Math.max(0,dangerT-dt*1.7);if(dangerT>=8){lost=paused=true;toast('خسرت بسبب الزحمة. اضغط ↻ للمحاولة من جديد.')}hud()}
function unlock(){if(stage===1&&score>=100){stage=2;lanes=2;rebuild();toast('↱ فتح المسار الثاني + الانعطاف يمين')}else if(stage===2&&score>=250){stage=3;rebuild();$('pick2').disabled=false;$('pick2').classList.remove('locked');toast('↰ فتح التقاطع الثاني + الانعطاف يسار')}else if(stage===3&&score>=450){stage=4;lanes=3;rebuild();toast('🛣️ ثلاثة مسارات + مسارات انعطاف مخصصة')}}
function rebuild(){for(const c of cars){c.lane=Math.min(c.lane,lanes-1);c.path=turnPath(c.dir,c.lane,c.mv);c.len=1000}}
function toggle(){if(yellow[selected]>0)return;phase[selected]=phase[selected]==='NS'?'EW':'NS';yellow[selected]=.55;sync()}
$('pick1').onclick=()=>{selected=0;sync()};$('pick2').onclick=()=>{if(stage>=3){selected=1;sync()}};$('switch').onclick=toggle;$('pause').onclick=()=>{if(!lost){paused=!paused;$('pause').textContent=paused?'▶':'Ⅱ'}};$('home').onclick=resetCam;$('reset').onclick=reset;
function sync(){$('pick1').classList.toggle('on',selected===0);$('pick2').classList.toggle('on',selected===1);$('pick1').innerHTML='تقاطع 1<br><small>'+(selected===0?'محدد':phase[0]==='NS'?'↕ أخضر':'↔ أخضر')+'</small>';$('pick2').innerHTML='تقاطع 2<br><small>'+(stage<3?'مغلق':selected===1?'محدد':phase[1]==='NS'?'↕ أخضر':'↔ أخضر')+'</small>';$('switch').innerHTML=(phase[selected]==='NS'?'↕':'↔')+' أخضر<br><small>اضغط للتبديل</small>'}
function toast(s){let e=$('toast');e.textContent=s;e.classList.add('show');clearTimeout(toast.tm);toast.tm=setTimeout(()=>e.classList.remove('show'),2500)}
function goal(){return stage===1?100:stage===2?250:stage===3?450:700}function hud(){let q=cars.filter(c=>c.wait>.8).length,n=goal(),p=stage===1?0:stage===2?100:stage===3?250:450;$('score').textContent=score;$('stage').textContent=stage;$('unlock').textContent=stage===1?'مستقيم فقط':stage===2?'يمين مفتوح':stage===3?'يمين + يسار':'3 مسارات مخصصة';$('queue').textContent=q;$('qstate').textContent=dangerT>4?'خطر':q>8?'مرتفع':'مستقر';$('next').textContent=n;$('prog').style.width=Math.min(100,(score-p)/(n-p)*100)+'%';$('desc').textContent=stage===1?'100 سيارة: المسار الثاني + يمين.':stage===2?'250 سيارة: تقاطع ثانٍ + يسار.':stage===3?'450 سيارة: المسار الثالث ومسارات انعطاف.':'اصمد لأعلى نتيجة.';$('danger').textContent=dangerT>0?'⚠️ منطقة خطر '+dangerT.toFixed(1)+' / 8 ثوانٍ':'اسحب الخريطة بإصبع. كبّر/صغّر بإصبعين.';sync()}
function drawRoad(){let g=G();X.save();X.translate(W/2,H/2);X.scale(cam.z,cam.z);X.translate(-cam.x,-cam.y);X.fillStyle='#b6d1ad';X.fillRect(-500,-500,g.worldW+1000,g.worldH+1000);let xs=stage>=3?g.cx:g.cx.slice(0,1);X.fillStyle='#d8c99f';for(const x of xs)X.fillRect(x-g.rw/2-6,-100,g.rw+12,g.worldH+200);X.fillRect(-100,g.cy-g.rw/2-6,g.worldW+200,g.rw+12);X.fillStyle='#35464a';for(const x of xs)X.fillRect(x-g.rw/2,-100,g.rw,g.worldH+200);X.fillRect(-100,g.cy-g.rw/2,g.worldW+200,g.rw);X.strokeStyle='#e9dfae';X.lineWidth=1.6;X.setLineDash([12,10]);for(const x of xs)for(let k=1;k<lanes*2;k++){let xx=x-g.rw/2+k*g.rw/(lanes*2);X.beginPath();X.moveTo(xx,-100);X.lineTo(xx,g.worldH+100);X.stroke()}for(let k=1;k<lanes*2;k++){let y=g.cy-g.rw/2+k*g.rw/(lanes*2);X.beginPath();X.moveTo(-100,y);X.lineTo(g.worldW+100,y);X.stroke()}X.setLineDash([]);X.fillStyle=dangerT?'#ff746750':'#ff746722';X.fillRect(-50,g.cy-g.rw/2,120,g.rw);X.fillRect(g.worldW-70,g.cy-g.rw/2,120,g.rw);for(const x of xs){X.fillRect(x-g.rw/2,-50,g.rw,110);X.fillRect(x-g.rw/2,g.worldH-60,g.rw,110)}
 for(let j=0;j<xs.length;j++){let x=xs[j],ph=phase[j],yl=yellow[j];for(const [xx,yy,ok] of [[x-g.stop*.9,g.cy-g.stop*.9,ph==='NS'&&yl<=0],[x+g.stop*.9,g.cy+g.stop*.9,ph==='NS'&&yl<=0],[x+g.stop*.9,g.cy-g.stop*.9,ph==='EW'&&yl<=0],[x-g.stop*.9,g.cy+g.stop*.9,ph==='EW'&&yl<=0]]){X.fillStyle=ok?'#72d58b':'#f07568';X.beginPath();X.arc(xx,yy,8/cam.z,0,7);X.fill()}}
 for(const c of cars)drawCar(c,g);X.restore()}
function drawCar(c,g){let p=pointPath(c),cw=Math.max(8,g.lw*.26),cl=cw*1.75;X.save();X.translate(p.x,p.y);X.rotate(p.ang);X.fillStyle='#17282c';X.fillRect(-cl/2-1,-cw/2-1,cl+2,cw+2);X.fillStyle=c.color;X.beginPath();if(X.roundRect)X.roundRect(-cl/2,-cw/2,cl,cw,Math.max(2,cw*.2));else X.rect(-cl/2,-cw/2,cl,cw);X.fill();X.fillStyle='#d7e8e9';X.fillRect(-cl*.08,-cw*.38,cl*.28,cw*.76);X.restore()}
function draw(){X.clearRect(0,0,W,H);drawRoad()}
C.addEventListener('pointerdown',e=>{ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});C.setPointerCapture(e.pointerId);if(ptr.size===1)gesture={type:'pan',x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y};else if(ptr.size===2){let a=[...ptr.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);gesture={type:'zoom',d,z:cam.z}}});
C.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});if(gesture?.type==='pan'&&ptr.size===1){cam.x=gesture.cx-(e.clientX-gesture.x)/cam.z;cam.y=gesture.cy-(e.clientY-gesture.y)/cam.z}else if(gesture?.type==='zoom'&&ptr.size===2){let a=[...ptr.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);cam.z=Math.max(.55,Math.min(1.7,gesture.z*d/gesture.d))}});
function up(e){ptr.delete(e.pointerId);gesture=null}C.addEventListener('pointerup',up);C.addEventListener('pointercancel',up);
function reset(){score=spawn=dangerT=0;stage=lanes=1;phase=['NS','NS'];yellow=[0,0];cars=[];nid=1;paused=lost=false;selected=0;$('pick2').disabled=true;$('pick2').classList.add('locked');$('pause').textContent='Ⅱ';resetCam();for(let i=0;i<10;i++)spawnCar(true);hud()}
function frame(n){requestAnimationFrame(frame);let dt=Math.min(.05,(n-last)/1000);last=n;if(!paused)step(dt);draw()}requestAnimationFrame(frame);reset();
</script></body></html>
