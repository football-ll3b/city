function sendAttack(from,to,ratio){if(paused||gameEnded||from.owner===null||!canSend(from,to)||from===to)return false;
 const n=Math.floor(from.troops*ratio);if(n<1)return false;from.troops-=n;updateCityVisual(from);
 const material=mat(COLORS[from.owner]);const marker=new T.Group();group.add(marker);for(let j=0;j<Math.min(5,Math.max(2,Math.ceil(n/15)));j++){let soldier=new T.Mesh(new T.ConeGeometry(.7,1.7,6),material);soldier.position.set((j%3-1)*1.5,0,Math.floor(j/3)*1.5);marker.add(soldier)}marker.position.set(from.x,5,from.z);
 const path=to.owner===from.owner?friendlyPath(from,to,from.owner):[from.id,to.id];
 armies.push({from,to,owner:from.owner,troops:n,progress:0,mesh:marker,path,pathIndex:0});return true}
function attackTarget(target){const sources=selectedSources.filter(c=>c.owner===0&&c!==target&&canSend(c,target)&&c.troops>0);
 if(!sources.length){info.textContent='لا يوجد طريق صالح: احتل القلاع السابقة أولًا، أو اربط قلاعك بمسار أزرق';return}
 const sent=sources.filter(c=>sendAttack(c,target,attackRatio)).length;
 selectedSources=[];multiSelect=false;updateSelections();showCity(target);
 document.getElementById('attackStatus').textContent=target.owner===0?'تم إرسال تعزيزات من '+sent+' قلعة':'تم إرسال هجوم من '+sent+' قلعة';}
function chooseCity(c){if(paused||gameEnded){showCity(c);return}
 if(selectedSources.length&&!selectedSources.includes(c)){
  if(c.owner!==0||!multiSelect){attackTarget(c);return}
  // Multi-select: tapping another blue castle adds a source. Use the
  // dedicated transfer button to send all selected armies to a blue destination.
 }
 if(c.owner===0){if(multiSelect){if(selectedSources.includes(c))selectedSources=selectedSources.filter(s=>s!==c);else selectedSources.push(c)}else selectedSources=[c];updateSelections();showCity(c)}
 else if(selectedSources.length)attackTarget(c);else showCity(c)}
function resolveArmy(a){const c=a.to;if(c.owner===a.owner){c.troops+=a.troops}
 else {const defense=Math.ceil(c.troops*(1+(c.level-1)*.055));if(a.troops>defense){c.owner=a.owner;c.troops=a.troops-defense;c.productionProgress=0}else{c.troops=Math.max(0,c.troops-Math.ceil(a.troops/(1+(c.level-1)*.055)))}}
 updateCityVisual(c);if(selectedCity===c)refreshPanel();checkEnd()}
function checkEnd(){const owned=mapData.cities.filter(c=>c.owner===0),flying=armies.some(a=>a.owner===0);if(!owned.length&&!flying){finish('خسرت المعركة! ابدأ خريطة جديدة للمحاولة مرة أخرى.');return}
 if(mapData.cities.every(c=>c.owner===0)&&!armies.some(a=>a.owner!==0))finish('انتصرت! سيطرت على جميع القلاع.')}
function finish(msg){if(gameEnded)return;finishRank(msg.startsWith('انتصرت'));gameEnded=true;info.textContent=msg;document.getElementById('hint').textContent=msg}
function tickArmies(dt){if(paused||gameEnded)return;for(let i=armies.length-1;i>=0;i--){const a=armies[i];
 const from=mapData.cities.find(c=>c.id===a.path[a.pathIndex]);const to=mapData.cities.find(c=>c.id===a.path[a.pathIndex+1]);
 if(!from||!to){group.remove(a.mesh);armies.splice(i,1);continue}
 // A captured intermediate castle blocks reinforcements; return surviving troops.
 if(a.pathIndex>0&&from.owner!==a.owner){const home=a.from;if(home.owner===a.owner)home.troops+=a.troops;group.remove(a.mesh);armies.splice(i,1);continue}
 const d=Math.hypot(from.x-to.x,from.z-to.z);a.progress+=dt*12/Math.max(6,d);
 const t=Math.min(1,a.progress);a.mesh.position.set(from.x+(to.x-from.x)*t,5+Math.sin(t*Math.PI*12)*.35,from.z+(to.z-from.z)*t);a.mesh.rotation.y=Math.atan2(to.x-from.x,to.z-from.z);
 if(t>=1){a.pathIndex++;a.progress=0;if(a.pathIndex>=a.path.length-1){group.remove(a.mesh);armies.splice(i,1);resolveArmy(a);if(gameEnded)break}}}}
function powerUse(type){if(paused||gameEnded||!mapData)return;const need={para:1,tank:2,missile:3,nuke:4}[type];if(rank<need){info.textContent='هذه القدرة تحتاج رتبة '+RANKS[need];return}if(cooldown[type]>0){info.textContent='انتظر انتهاء وقت القدرة';return}const source=mapData.cities.find(c=>c.owner===0);if(!source){info.textContent='ليس لديك قلاع';return}let target=selectedCity;if(!target||target.owner===0){info.textContent='اضغط قلعة معادية أو محايدة أولًا ثم استخدم القدرة';return}const level=Math.min(5,Math.max(1,rank-need+1));if(type==='para'||type==='tank'){const troops=(type==='para'?15:24)*level;const m=mat(COLORS[0]),marker=new T.Group();group.add(marker);for(let j=0;j<4;j++){const soldier=new T.Mesh(new T.ConeGeometry(.8,2,6),m);soldier.position.set((j%2)*2,0,Math.floor(j/2)*2);marker.add(soldier)}marker.position.set(source.x,5,source.z);armies.push({from:source,to:target,owner:0,troops,progress:0,mesh:marker,path:[source.id,target.id],pathIndex:0,ability:true})}else{target.troops=Math.max(0,target.troops-Math.ceil((type==='nuke'?60:22)*level));updateCityVisual(target);refreshPanel()}cooldown[type]={para:50,tank:65,missile:75,nuke:115}[type];info.textContent='تم استخدام '+({para:'المظليين',tank:'الدبابات',missile:'الصاروخ',nuke:'النووي'}[type])+' مستوى '+level}
for(const [type,id] of Object.entries({para:'powerPara',tank:'powerTank',missile:'powerMissile',nuke:'powerNuke'})){document.getElementById(id).onclick=()=>powerUse(type)}
function updatePowerButtons(dt){for(const type of Object.keys(cooldown))cooldown[type]=Math.max(0,cooldown[type]-(paused||gameEnded?0:dt));for(const [type,id,need] of [['para','powerPara',1],['tank','powerTank',2],['missile','powerMissile',3],['nuke','powerNuke',4]]){const b=document.getElementById(id);b.disabled=rank<need||cooldown[type]>0;b.title=rank<need?'تفتح عند رتبة '+RANKS[need]:'';b.textContent=({para:'🪂 مظليون',tank:'🛡️ دبابات',missile:'🚀 صاروخ',nuke:'☢️ نووي'}[type])+(rank<need?' 🔒':cooldown[type]>0?' '+Math.ceil(cooldown[type])+'ث':' Lv'+Math.min(5,rank-need+1))}}
function aiTurn(dt){if(paused||gameEnded)return;aiClock+=dt;if(aiClock<1.6)return;aiClock=0;
 for(let player=1;player<=4;player++){
 const owned=mapData.cities.filter(c=>c.owner===player);if(!owned.length)continue;
 for(const c of owned){if(c.level<Math.min(6,1+Math.floor(c.troops/35))&&c.troops>upgradeCost(c)+15){c.troops-=upgradeCost(c);c.level++;updateCityVisual(c)}}
 const options=[];for(const c of owned){if(c.troops<12)continue;for(const t of mapData.cities){if(t.owner===player||!adjacent(c,t))continue;const defense=t.troops*(1+(t.level-1)*.055);options.push({c,t,score:c.troops-defense+(t.owner===null?9:0)+rand()*10})}}
 options.sort((a,b)=>b.score-a.score);if(options.length&&options[0].score>3){const {c,t}=options[0];sendAttack(c,t,.75)}
 }}
let target=new T.Vector3(),yaw=.65,pitch=1.08,dist=175;function resetCamera(){yaw=.65;pitch=1.08;{let bounds=mapData.islands.reduce((b,i)=>({minX:Math.min(b.minX,i.x-i.rx),maxX:Math.max(b.maxX,i.x+i.rx),minZ:Math.min(b.minZ,i.z-i.rz),maxZ:Math.max(b.maxZ,i.z+i.rz)}),{minX:Infinity,maxX:-Infinity,minZ:Infinity,maxZ:-Infinity});target.set((bounds.minX+bounds.maxX)/2,0,(bounds.minZ+bounds.maxZ)/2);const width=bounds.maxX-bounds.minX,depth=bounds.maxZ-bounds.minZ;const aspect=innerWidth/innerHeight;const vfov=camera.fov*Math.PI/180;const visibleHeight=depth*Math.cos(pitch)+width*.18+22;const visibleWidth=width+depth*.16+18;dist=Math.max(visibleHeight/(2*Math.tan(vfov/2)),visibleWidth/(2*Math.tan(vfov/2)*aspect))*1.13;dist=Math.max(dist,115);}updateCamera()}function updateCamera(){pitch=Math.max(.2,Math.min(1.48,pitch));dist=Math.max(20,Math.min(450,dist));camera.position.set(target.x+dist*Math.sin(pitch)*Math.cos(yaw),target.y+dist*Math.cos(pitch),target.z+dist*Math.sin(pitch)*Math.sin(yaw));camera.lookAt(target)}const pointers=new Map();let lastPinch=0,lastMid=null,moved=false;let pointerStart=null;renderer.domElement.addEventListener('pointerdown',e=>{pointerStart={x:e.clientX,y:e.clientY};renderer.domElement.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false});renderer.domElement.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const old=pointers.get(e.pointerId);let dx=e.clientX-old.x,dy=e.clientY-old.y;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointerStart&&Math.hypot(e.clientX-pointerStart.x,e.clientY-pointerStart.y)>9)moved=true;if(pointers.size===1){yaw-=dx*.007;pitch-=dy*.006}else if(pointers.size===2){let ps=[...pointers.values()],d=Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y),mid={x:(ps[0].x+ps[1].x)/2,y:(ps[0].y+ps[1].y)/2};if(lastPinch)dist*=lastPinch/d;if(lastMid){let right=new T.Vector3().setFromMatrixColumn(camera.matrix,0);let forward=new T.Vector3();camera.getWorldDirection(forward);forward.y=0;forward.normalize();target.addScaledVector(right,-(mid.x-lastMid.x)*dist/750);target.addScaledVector(forward,(mid.y-lastMid.y)*dist/750)}lastPinch=d;lastMid=mid}updateCamera()});renderer.domElement.addEventListener('pointerup',e=>{if(!moved&&pointers.size===1){let rect=renderer.domElement.getBoundingClientRect(),p=new T.Vector2((e.clientX-rect.left)/rect.width*2-1,-(e.clientY-rect.top)/rect.height*2+1),ray=new T.Raycaster();ray.setFromCamera(p,camera);let hit=ray.intersectObjects(pickable)[0];if(hit){let c=hit.object.userData.city;chooseCity(c);info.textContent=`مدينة ${c.id} • ${c.owner===null?'محايدة / '+({weak:'ضعيفة',medium:'متوسطة',strong:'قوية',fortress:'القلعة الكبرى'}[c.strength]||'محايدة'):c.owner===0?'مدينتك':'كمبيوتر '+c.owner} • المستوى ${c.level}`}}pointers.delete(e.pointerId);pointerStart=null;lastPinch=0;lastMid=null});renderer.domElement.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);lastPinch=0;lastMid=null});renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();dist*=Math.exp(e.deltaY*.001);updateCamera()},{passive:false});document.querySelectorAll('[data-ratio]').forEach(b=>b.onclick=()=>{attackRatio=Number(b.dataset.ratio);document.querySelectorAll('[data-ratio]').forEach(x=>x.classList.toggle('active',x===b));document.getElementById('ratio').value=String(attackRatio)});document.getElementById('ratio').onchange=e=>{attackRatio=Number(e.target.value);document.querySelectorAll('[data-ratio]').forEach(b=>b.classList.toggle('active',Number(b.dataset.ratio)===attackRatio))};document.getElementById('multiMode').onclick=()=>{multiSelect=!multiSelect;updateSelections()};document.getElementById('transferMode').onclick=()=>{if(!selectedSources.length){info.textContent='حدد قلعة أو عدة قلاع زرقاء أولًا';return}const targets=mapData.cities.filter(c=>c.owner===0&&!selectedSources.includes(c)&&selectedSources.some(s=>friendlyPath(s,c,0)));if(!targets.length){info.textContent='لا توجد قلعة زرقاء متصلة للتعزيزات';return}const ids=targets.map(c=>c.id).join('، ');const id=Number(prompt('رقم القلعة الزرقاء المستهدفة: '+ids,targets[0].id));const target=targets.find(c=>c.id===id);if(target)attackTarget(target)};document.getElementById('attackMode').onclick=()=>{multiSelect=false;updateSelections();info.textContent='اختر قلعة زرقاء ثم قلعة متصلة للهجوم'};document.getElementById('cancelAttack').onclick=()=>{selectedSources=[];multiSelect=false;updateSelections()};document.getElementById('clear').onclick=()=>{selectedSources=[];updateSelections()};document.getElementById('closeCity').onclick=()=>{selectedCity=null;document.getElementById('cityPanel').style.display='none'};document.getElementById('upgradeCity').onclick=()=>{const c=selectedCity;if(!c||c.owner!==0||c.level>=10||paused)return;const cost=upgradeCost(c);if(c.troops<cost)return;c.troops-=cost;c.level++;updateCityVisual(c);refreshPanel()};document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'استئناف':'إيقاف مؤقت';refreshPanel()};document.getElementById('generate').onclick=generate;document.getElementById('size').onchange=generate;document.getElementById('reset').onclick=resetCamera;document.getElementById('export').onclick=()=>{if(!mapData)return;let blob=new Blob([JSON.stringify(mapData,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='harb-aljuzur-'+mapData.size+'-'+mapData.seed+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);if(mapData)resetCamera()});generate();let previous=performance.now();(function animate(now){requestAnimationFrame(animate);let dt=Math.min(.1,(now-previous)/1000);previous=now;updateTroops(dt);tickArmies(dt);aiTurn(dt);updatePowerButtons(dt);labels.forEach(l=>{l.visible=dist<155});renderer.render(scene,camera)})(performance.now())})();
